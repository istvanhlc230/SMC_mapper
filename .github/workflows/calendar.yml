name: Calendar Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile calendar.py
      - name: Calendar unit/runtime contract tests
        shell: bash
        run: |
          python - <<'PY'
          import contextlib
          import io
          import json
          from datetime import datetime

          import calendar

          def dt(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          assert calendar.__version__ == "2.3.0"
          assert calendar.SCHEMA_VERSION == 2

          assert calendar.validate_symbol("EURUSD") == "EURUSD"
          assert calendar.validate_symbol("USDGBP") == "USDGBP"
          assert calendar.validate_symbol("HUF") == "HUF"
          assert calendar.validate_symbol("NVDA") == "NVDA"

          one_day = calendar.parse_date("2026.10.05")
          next_day = calendar.parse_date("2026.10.06")
          assert calendar.build_forexfactory_query(one_day, next_day) == "day=oct5.2026"
          range_end = calendar.parse_date("2026.10.11")
          assert calendar.build_forexfactory_query(one_day, range_end) == "range=oct5.2026-oct10.2026"

          html = """<html><body>
          <div>Calendar Time Zone: Europe/Budapest (GMT +2)</div>
          <table><tbody>
          <tr class="calendar__row calendar_row" data-eventid="1001">
            <td class="calendar__cell calendar__date date">Mon Oct 5</td>
            <td class="calendar__cell calendar__time time">9:00am</td>
            <td class="calendar__cell calendar__currency currency">EUR</td>
            <td class="calendar__cell calendar__impact impact"><span title="High Impact Expected" class="high"></span></td>
            <td class="calendar__cell calendar__event event"><span class="calendar__event-title">ECB Test Event</span></td>
            <td class="calendar__cell calendar__actual actual"></td>
            <td class="calendar__cell calendar__forecast forecast">1.2%</td>
            <td class="calendar__cell calendar__previous previous">1.0%</td>
          </tr>
          </tbody></table></body></html>"""
          rows = calendar.parse_forexfactory_html_events(
              html,
              dt("2026-10-04T00:00:00Z"),
              dt("2026-10-06T00:00:00Z"),
          )
          assert len(rows) == 1
          assert rows[0]["id"] == "1001"
          assert "url" not in rows[0]

          id_only_html = """<html><body>
          <div>Calendar Time Zone: Europe/Budapest (GMT +2)</div>
          <table><tbody>
          <tr data-event-id="1002">
            <td class="calendar__cell calendar__date date">Mon Oct 5</td>
            <td class="calendar__cell calendar__time time">10:00am</td>
            <td class="calendar__cell calendar__currency currency">USD</td>
            <td class="calendar__event event"><span class="calendar__event-title">ID Only Test</span></td>
          </tr>
          </tbody></table></body></html>"""
          id_only = calendar.parse_forexfactory_html_events(
              id_only_html,
              dt("2026-10-04T00:00:00Z"),
              dt("2026-10-06T00:00:00Z"),
          )
          assert [row["id"] for row in id_only] == ["1002"]

          detail_json = json.dumps({
              "data": {
                  "specs": [
                      {"order": -1, "title": "Source", "html": "<a href='https://example.com'>Source text</a>"},
                      {"order": 7, "title": "Measures", "html": "Measures text"},
                      {"order": 7, "title": "Frequency", "html": "Monthly"},
                  ]
              }
          })
          original_fetch_url = calendar.fetch_url
          try:
              calendar.fetch_url = lambda _url: detail_json
              specs = calendar.fetch_forexfactory_event_detail("146900")
              assert [item["title"] for item in specs] == ["Source", "Measures", "Frequency"]
              assert [item["order"] for item in specs] == [-1, 7, 7]
              assert specs[0]["html"].startswith("<a href=")
          finally:
              calendar.fetch_url = original_fetch_url

          normalized = calendar.normalize_provider_event({
              "id": "146900",
              "dateline": int(dt("2026-10-05T07:00:00Z").timestamp()),
              "currency": "USD",
              "name": "Detail Test",
              "impactName": "Low Impact Expected",
              "actual": None,
              "forecast": None,
              "previous": None,
          })
          normalized["details"]["specs"] = specs
          assert "url" not in normalized["details"]
          calendar.validate_calendar_document({
              "schema_version": 2,
              "events": [normalized],
              "coverage": [],
              "watermarks": {},
          })

          original_fetch_url = calendar.fetch_url
          original_detail_fetch = calendar.fetch_forexfactory_event_detail
          calendar_detail_payload = """<html><body>
          <div>Calendar Time Zone: Europe/Budapest (GMT +2)</div>
          <script>{}</script>
          </body></html>""".format(json.dumps({"days": [{"events": [{
              "id": "146901",
              "dateline": int(dt("2026-10-05T07:00:00Z").timestamp()),
              "currency": "USD",
              "name": "Fetched Detail Event",
              "impactName": "High Impact Expected",
              "actual": None,
              "forecast": None,
              "previous": None,
          }]}]}))
          detail_by_id = {
              "146901": [
                  {"order": -3, "title": "Source", "html": "<a href='https://example.com/source'>Example</a>"},
                  {"order": 2, "title": "Why Traders Care", "html": "Traders care."},
              ]
          }
          try:
              calendar.fetch_url = lambda _url: calendar_detail_payload
              calendar.fetch_forexfactory_event_detail = lambda event_id: detail_by_id[event_id]
              acquired = calendar.fetch_forexfactory(
                  dt("2026-10-05T00:00:00Z"),
                  dt("2026-10-06T00:00:00Z"),
              )
              assert len(acquired) == 1
              assert acquired[0]["event_id"] == "forexfactory:146901"
              assert [x["title"] for x in acquired[0]["details"]["specs"]] == ["Source", "Why Traders Care"]
              assert "url" not in acquired[0]["details"]
          finally:
              calendar.fetch_url = original_fetch_url
              calendar.fetch_forexfactory_event_detail = original_detail_fetch

          detail_failure_original_fetch_url = calendar.fetch_url
          detail_failure_original_detail_fetch = calendar.fetch_forexfactory_event_detail
          try:
              calendar.fetch_url = lambda _url: calendar_detail_payload
              calendar.fetch_forexfactory_event_detail = lambda _event_id: (_ for _ in ()).throw(
                  calendar.ProviderError("synthetic detail failure")
              )
              try:
                  calendar.fetch_forexfactory(
                      dt("2026-10-05T00:00:00Z"),
                      dt("2026-10-06T00:00:00Z"),
                  )
                  raise AssertionError("Detail failure was swallowed")
              except calendar.ProviderError as exc:
                  assert "synthetic detail failure" in str(exc)
          finally:
              calendar.fetch_url = detail_failure_original_fetch_url
              calendar.fetch_forexfactory_event_detail = detail_failure_original_detail_fetch

          cleartext = calendar.format_cleartext_details({
              "currency": "USD",
              "impact": "HIGH",
              "actual": None,
              "forecast": "1.2%",
              "previous": "1.0%",
              "specs": [
                  {"order": -1, "title": "Source", "html": "<a href='https://example.com'>Example Source</a>"},
                  {"order": 1, "title": "Measures", "html": "Monthly data."},
              ],
          })
          assert any("Source   : Example Source" in line for line in cleartext)
          assert any("Measures : Monthly data." in line for line in cleartext)

          legacy = calendar.build_empty_calendar_document()
          legacy["events"] = [{
              "event_id": "forexfactory:legacy",
              "symbol": "USD",
              "asset_type": "forex",
              "event_type": "economic",
              "source": "forexfactory",
              "timestamp": "2026-10-05T12:00:00Z",
              "title": "Legacy Event",
              "details": {
                  "currency": "USD",
                  "impact": "HIGH",
                  "actual": None,
                  "forecast": None,
                  "previous": None,
                  "url": None,
              },
          }]
          legacy["coverage"] = [{
              "provider": "forexfactory",
              "symbol": "USD",
              "start": "2026-10-05T00:00:00Z",
              "end": "2026-10-06T00:00:00Z",
              "status": "COMPLETE",
              "updated_at": "2026-10-05T00:00:00Z",
          }]
          assert calendar.find_uncovered_intervals(
              legacy,
              "forexfactory",
              "USD",
              dt("2026-10-05T00:00:00Z"),
              dt("2026-10-06T00:00:00Z"),
          ) == [(dt("2026-10-05T00:00:00Z"), dt("2026-10-06T00:00:00Z"))]

          print("CALENDAR_TESTS_OK")
          PY
