                  dt("2026-10-05T10:00:00Z"), []
              )
              first_current = operations.acquire_current(refresh_doc, "NVDA")
              second_current = operations.acquire_current(refresh_doc, "NVDA")
              assert refresh_calls["value"] == 2
              assert first_current["provider_results"][0]["status"] == "NO_MATCH"
              assert second_current["provider_results"][0]["status"] == "NO_MATCH"
          finally:
              domain.resolve_applicable_providers = original_resolve
              providers.fetch_yahoo_news = original_fetch_yahoo
              storage.save_calendar_atomic = original_save
              domain.utc_now = original_now

          # current stdout must expose aggregate status but not provider exception details.
          original_run_query = calendar.run_query
          original_cli_run_query = __import__("CALENDAR.cli", fromlist=["run_query"]).run_query
          original_current_acquire = operations.acquire_current
          original_load = storage.load_calendar_document
          try:
              operations.acquire_current = lambda *_args, **_kwargs: {
                  "events": [],
                  "provider_results": [{
                      "provider": "yahoo_finance",
                      "status": "ERROR",
                      "error": "synthetic provider failure should stay diagnostic",
                  }],
              }
              storage.load_calendar_document = lambda: domain.build_empty_calendar_document()
              __import__("CALENDAR.cli", fromlist=["run_query"]).run_query = original_cli_run_query
              out = io.StringIO()
              with contextlib.redirect_stdout(out):
                  assert calendar.run_query("NVDA", "current", cleartext=False, debug=False) == 2
              public_output = out.getvalue()
              assert "synthetic provider failure should stay diagnostic" not in public_output
              assert "\"error\"" not in public_output
              parsed_output = json.loads(public_output)
              assert parsed_output["status"] == "UNAVAILABLE"
              assert parsed_output["providers"] == []
          finally:
              operations.acquire_current = original_current_acquire
              storage.load_calendar_document = original_load
              calendar.run_query = original_run_query
              __import__("CALENDAR.cli", fromlist=["run_query"]).run_query = original_cli_run_query

          # A provider may complete successfully with zero matching events.
          # This is a successful no-match, not a partial acquisition.
          original_resolve = domain.resolve_applicable_providers
          original_fetch_yahoo = providers.fetch_yahoo_news
          original_save = storage.save_calendar_atomic
          try:
              domain.resolve_applicable_providers = lambda _symbol: ["yahoo_finance"]
              providers.fetch_yahoo_news = lambda _symbol: []
              storage.save_calendar_atomic = lambda document: None

              no_match_doc = domain.build_empty_calendar_document()
              no_match_result = operations.acquire_explicit(
                  no_match_doc,
                  "CCCC",
                  dt("2026-10-01T00:00:00Z"),
                  dt("2026-10-03T00:00:00Z"),
              )
              assert no_match_result["failures"] == []
              assert no_match_result["provider_results"][0]["status"] == "NO_MATCH"
              assert no_match_doc["events"] == []
              assert "yahoo_finance|CCCC" in no_match_doc["watermarks"]

              assert domain.status_from_provider_results(
                  no_match_result["provider_results"]
              ) == "NO_RELEVANT_EVENT"
          finally:
              domain.resolve_applicable_providers = original_resolve
              providers.fetch_yahoo_news = original_fetch_yahoo
              storage.save_calendar_atomic = original_save

          print("CALENDAR_TESTS_OK")
          PY
