              assert {
                  result["provider"] for result in concurrent_refresh_result["provider_results"]
              } == set(concurrent_refresh_providers)
          finally:
              operations._fetch_provider_events = original_concurrent_fetch

          # Scope-based refresh force-fetches provider data, compares stable event IDs,
