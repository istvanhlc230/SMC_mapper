name: Calendar Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile calendar.py && python -m compileall -q COMMON CALENDAR
      - name: Calendar unit/runtime contract tests
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import io
          import contextlib
          import sys
          import subprocess
          import tempfile
          import threading
          from datetime import datetime, timedelta, timezone

          import calendar
          from CALENDAR import domain, operations, providers, storage
          # Shared Calendar HTTP requests must use the IPv4-first transport.
          original_http_get = providers.HttpClient.get
          captured_http_request = {}
          def capture_http_get(url, **kwargs):
              captured_http_request["url"] = url
              captured_http_request.update(kwargs)
              return "synthetic response"
          try:
              providers.HttpClient.get = staticmethod(capture_http_get)
              assert providers.fetch_url("https://example.invalid/calendar") == "synthetic response"
              assert captured_http_request["ipv4_first"] is True
              assert captured_http_request["retries"] == 1
              assert captured_http_request["timeout_seconds"] == providers.HTTP_TIMEOUT
          finally:
              providers.HttpClient.get = staticmethod(original_http_get)


          def dt(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          # LSE's region query expects geographic region codes (EU, US), not
          # three-letter ISO 4217 currency codes (EUR, USD).
          assert providers._resolve_lse_regions("EURUSD") == ["EU", "US"]
          assert providers._resolve_lse_regions("EUR/USD") == ["EU", "US"]
          assert providers._resolve_lse_regions("USD") == ["US"]
          assert providers._resolve_lse_regions("HUF") == ["HU"]

          # LSE responses can expose a geographic code where Calendar needs an ISO currency.
          lse_region_event = {
              "id": "lse-region-us",
              "event": "US Test Event",
              "datetime": "2026-10-06 12:30:00",
              "region_code": "US",
              "impact": "HIGH",
              "time": "12:30 PM",
              "actual_revised": 0,
              "updated_at": "2026-10-06 12:25:00",
          }
          normalized_region_event = providers.normalize_lse_event(lse_region_event)
          assert normalized_region_event["symbol"] == "USD"
          assert normalized_region_event["details"]["currency"] == "USD"
          assert normalized_region_event["details"]["provider_fields"] == {
              "lse": {
                  "time": "12:30 PM",
                  "actual_revised": 0,
                  "updated_at": "2026-10-06 12:25:00",
              }
          }
          assert "time" not in normalized_region_event["details"]["provider_fields"]
          lse_country_event = dict(lse_region_event, id="lse-country-eu", region_code=None, country_code="EU")
          normalized_country_event = providers.normalize_lse_event(lse_country_event)
          assert normalized_country_event["details"]["currency"] == "EUR"

          # One unknown LSE geography must be isolated instead of poisoning all stored events.
          original_lse_rows_fetch = providers._fetch_lse_rows
          try:
              providers._fetch_lse_rows = lambda _symbol, _start, _end: [
                  lse_region_event,
                  {
                      "id": "lse-unknown-region",
                      "event": "Unknown Region Test",
                      "datetime": "2026-10-06 13:30:00",
                      "region_code": "ZZZ",
                  },
              ]
              unresolved_lse_currencies = []
              lse_normalized_events = providers.fetch_lse_calendar(
                  "EURUSD",
                  dt("2026-10-06T00:00:00Z"),
                  dt("2026-10-07T00:00:00Z"),
                  unresolved_event_currency_ids=unresolved_lse_currencies,
              )
              assert [event["event_id"] for event in lse_normalized_events] == ["lse:lse-region-us"]
              assert unresolved_lse_currencies == ["lse-unknown-region"]
          finally:
              providers._fetch_lse_rows = original_lse_rows_fetch

          # LSE watermarks are valid persisted identities just like the other providers.
          lse_watermark_doc = domain.build_empty_calendar_document()
          domain.update_watermark(
              lse_watermark_doc, "lse", "USD", dt("2026-10-06T12:31:00Z"), []
          )
          domain.validate_calendar_document(lse_watermark_doc)
          assert "lse|USD" in lse_watermark_doc["watermarks"]

          # A stock ticker is outside LSE's Calendar role and must not require
          # an LSE key or issue a network request.
          original_lse_key_loader = providers.get_provider_api_key
          original_lse_open_url = providers.open_url
          try:
              providers.get_provider_api_key = lambda provider: (_ for _ in ()).throw(
                  AssertionError("stock ticker should not load LSE credentials")
              )
              assert providers._fetch_lse_rows(
                  "NVDA", dt("2026-10-06T00:00:00Z"), dt("2026-10-07T00:00:00Z")
              ) == []
              providers.get_provider_api_key = lambda provider: "test-lse-api-key"

              class SyntheticLSECalendarResponse:
                  status = 200
                  def read(self):
                      return b"[]"
                  def __enter__(self):
                      return self
                  def __exit__(self, exc_type, exc_value, traceback):
                      return False

              captured_lse_request = {}
              def fake_lse_open_url(request, *, timeout_seconds, ipv4_first):
                  assert timeout_seconds > 0
                  assert ipv4_first is True
                  captured_lse_request["request"] = request
                  return SyntheticLSECalendarResponse()

              providers.open_url = fake_lse_open_url
              assert providers._fetch_lse_rows(
                  "EURUSD", dt("2026-10-06T00:00:00Z"), dt("2026-10-07T00:00:00Z")
              ) == []
              lse_query = providers.urllib.parse.parse_qs(
                  providers.urllib.parse.urlparse(
                      captured_lse_request["request"].full_url
                  ).query
              )
              assert lse_query["region"] == ["EU,US"]
              # Calendar API boundaries are date-only; candle API boundaries
              # deliberately remain timestamp-based in their separate adapter.
              assert lse_query["start"] == ["2026-10-06"]
              assert lse_query["end"] == ["2026-10-07"]
              assert "T" not in lse_query["start"][0]
              assert "T" not in lse_query["end"][0]
              assert captured_lse_request["request"].get_header("X-api-key") == "test-lse-api-key"

              # HTTP error text is retained for --debug but request credentials
              # and URL query details must not be included in the exception.
              import urllib.error
              def rejected_lse_open_url(request, *, timeout_seconds, ipv4_first):
                  assert timeout_seconds > 0
                  assert ipv4_first is True
                  raise urllib.error.HTTPError(
                      request.full_url, 400, "Bad Request", {},
                      io.BytesIO(b'{"detail":"invalid region filter"}')
                  )
              providers.open_url = rejected_lse_open_url
              try:
                  providers._fetch_lse_rows(
                      "EURUSD", dt("2026-10-06T00:00:00Z"), dt("2026-10-07T00:00:00Z")
                  )
              except calendar.ProviderError as exc:
                  assert "LSE HTTP 400: invalid region filter" in str(exc)
                  assert "test-lse-api-key" not in str(exc)
                  assert "region=EU" not in str(exc)
              else:
                  raise AssertionError("LSE HTTP failure must be surfaced")
          finally:
              providers.get_provider_api_key = original_lse_key_loader
              providers.open_url = original_lse_open_url

          assert calendar.validate_symbol("EURUSD") == "EURUSD"
          assert calendar.__version__ == "2.8.0"
          assert calendar.validate_symbol("USDGBP") == "USDGBP"
          assert calendar.validate_symbol("HUF") == "HUF"
          assert calendar.validate_symbol("NVDA") == "NVDA"
          # All three provider adapters are part of the Calendar contract.
          assert domain.resolve_applicable_providers("EURUSD") == [
              "lse", "forexfactory", "yahoo_finance"
          ]
          assert domain.resolve_applicable_providers("NVDA") == [
              "lse", "forexfactory", "yahoo_finance"
          ]

          # LSE and ForexFactory facts with the same economic identity are enriched,
          # not stored as duplicate events.
          lse_event = {
              "event_id": "lse:1",
              "symbol": "USD",
              "asset_type": "forex",
              "event_type": "economic",
              "source": "lse",
              "sources": ["lse"],
              "timestamp": "2026-10-06T12:30:00Z",
              "title": "US CPI",
              "details": {
                  "currency": "USD", "impact": "HIGH",
                  "actual": "3.1", "forecast": "3.0", "previous": None,
              },
          }
          ff_event = {
              "event_id": "forexfactory:2",
              "symbol": "USD",
              "asset_type": "forex",
              "event_type": "economic",
              "source": "forexfactory",
              "sources": ["forexfactory"],
              "timestamp": "2026-10-06T12:30:00Z",
              "title": "US CPI",
              "details": {
                  "currency": "USD", "impact": "HIGH",
                  "actual": None, "forecast": "3.0", "previous": "3.2", "specs": [],
              },
          }
          merge_doc = domain.build_empty_calendar_document()
          domain.merge_events(merge_doc, [lse_event])
          domain.merge_events(merge_doc, [ff_event])
          assert len(merge_doc["events"]) == 1
          assert set(merge_doc["events"][0]["sources"]) == {"lse", "forexfactory"}
          assert merge_doc["events"][0]["details"]["previous"] == "3.2"

          # Legacy flat and mixed provider fields migrate to the canonical nested form.
          legacy_provider_fields_doc = domain.build_empty_calendar_document()
          legacy_provider_fields_event = dict(lse_event)
          legacy_provider_fields_event["details"] = dict(lse_event["details"])
          legacy_provider_fields_event["details"]["provider_fields"] = {
              "time": "10:00 AM",
              "updated_at": "old timestamp",
              "lse": {"time": "10:00 AM", "updated_at": "nested timestamp"},
          }
          legacy_provider_fields_doc["events"] = [legacy_provider_fields_event]
          assert domain.normalize_calendar_document_provider_fields(legacy_provider_fields_doc)
          assert legacy_provider_fields_doc["events"][0]["details"]["provider_fields"] == {
              "lse": {"time": "10:00 AM", "updated_at": "nested timestamp"}
          }
          assert not domain.normalize_calendar_document_provider_fields(legacy_provider_fields_doc)
          domain.validate_calendar_document(legacy_provider_fields_doc)

          # The persistence loader normalizes existing cache data before schema validation.
          original_json_loader = storage._load_json_file
          try:
              storage_migration_doc = domain.build_empty_calendar_document()
              storage_migration_event = dict(lse_event)
              storage_migration_event["details"] = dict(lse_event["details"])
              storage_migration_event["details"]["provider_fields"] = {
                  "time": "10:00 AM",
                  "updated_at": "legacy timestamp",
              }
              storage_migration_doc["events"] = [storage_migration_event]
              storage._load_json_file = lambda: storage_migration_doc
              loaded_migration_doc = storage.load_calendar_document()
              assert loaded_migration_doc["events"][0]["details"]["provider_fields"] == {
                  "lse": {
                      "time": "10:00 AM",
                      "updated_at": "legacy timestamp",
                  }
              }
          finally:
              storage._load_json_file = original_json_loader

          # Atomic saves must serialize canonical provider fields, not a legacy flat layout.
          original_atomic_writer = storage.atomic_write_text
          try:
              saved_json = {}
              storage.atomic_write_text = lambda _path, text, **kwargs: saved_json.update(
                  {"content": text}
              )
              save_migration_doc = domain.build_empty_calendar_document()
              save_migration_event = dict(lse_event)
              save_migration_event["details"] = dict(lse_event["details"])
              save_migration_event["details"]["provider_fields"] = {
                  "time": "10:00 AM",
                  "lse": {"time": "10:00 AM", "updated_at": "new timestamp"},
              }
              save_migration_doc["events"] = [save_migration_event]
              storage.save_calendar_atomic(save_migration_doc)
              serialized_migration_doc = json.loads(saved_json["content"])
              assert serialized_migration_doc["events"][0]["details"]["provider_fields"] == {
                  "lse": {"time": "10:00 AM", "updated_at": "new timestamp"}
              }
          finally:
              storage.atomic_write_text = original_atomic_writer

          # An incoming refresh replaces only the same provider's values; no flattened keys return.
          incoming_lse_event = dict(lse_event)
          incoming_lse_event["details"] = dict(lse_event["details"])
          incoming_lse_event["details"]["provider_fields"] = {
              "lse": {"time": "10:00 AM", "updated_at": "new timestamp", "actual_revised": 0}
          }
          domain.merge_events(legacy_provider_fields_doc, [incoming_lse_event])
          assert legacy_provider_fields_doc["events"][0]["details"]["provider_fields"] == {
              "lse": {"time": "10:00 AM", "updated_at": "new timestamp", "actual_revised": 0}
          }

          # Importing urllib/email while the repository root shadows stdlib calendar
          # must not eagerly import the Calendar provider graph or create an import cycle.
          stdlib_import_check = subprocess.run(
              [sys.executable, "-c", "import urllib.request, email.parser, calendar; assert callable(calendar.timegm)"],
              capture_output=True,
              text=True,
          )
          assert stdlib_import_check.returncode == 0, stdlib_import_check.stderr

          no_args_help = subprocess.run(
              [sys.executable, "calendar.py"],
              capture_output=True,
              text=True,
          )
          assert no_args_help.returncode == 0, no_args_help.stderr
          assert "USAGE" in no_args_help.stdout

          import CALENDAR.cli as calendar_cli
          from COMMON.date_time import DateTimeScopeParser, DateTimeScopeError

          # The shared parser exposes one deterministic UTC grammar for every consumer.
          parser = DateTimeScopeParser(reference_time=dt("2026-10-06T12:00:00Z"))
          assert parser.parse("2026.10.06").kind == "DATE"
          assert parser.parse("2026.10.06 10:30").start == dt("2026-10-06T10:30:00Z")
          assert parser.parse("2026.10.05-2026.10.06").end == dt("2026-10-07T00:00:00Z")
          assert parser.parse("2026.10.06 10:00-2026.10.06 11:00").end == dt("2026-10-06T11:00:00Z")
          assert parser.parse("10:30").start == dt("2026-10-06T10:30:00Z")
          assert parser.parse("10:00-11:00").end == dt("2026-10-06T11:00:00Z")
          assert parser.parse("-10:30").end == dt("2026-10-06T10:31:00Z")
          for invalid_scope in ("2026.02.30", "25:00", "11:00-10:00", "2026.10.01 10:00-11:00", "2026.10.06@10:30"):
              try:
                  parser.parse(invalid_scope)
              except DateTimeScopeError:
                  pass
              else:
                  raise AssertionError(f"invalid common scope must be rejected: {invalid_scope}")
          fixed_utc_now = domain.utc_now
          try:
              domain.utc_now = lambda: dt("2026-10-06T12:00:00Z")
              shorthand_request = calendar_cli.parse_calendar_cli_request(
                  ["EURUSD", "10:00-11:00", "refresh"]
              )
              assert shorthand_request["scope"] == "10:00-11:00"
              assert shorthand_request["refresh"] is True
              delete_request = calendar_cli.parse_calendar_cli_request(
                  ["delete", "EURUSD", "10:00-11:00"]
              )
              assert delete_request["scope"] == "10:00-11:00"
          finally:
              domain.utc_now = fixed_utc_now

          # Relative query grammar: current/latest/next/prev/news.
          fixed_utc_now = domain.utc_now
          try:
              domain.utc_now = lambda: dt("2026-10-07T12:30:00Z")
              for args, expected in (
                  (["EURUSD", "current"], "current"),
                  (["EURUSD", "next"], "next"),
                  (["EURUSD", "prev"], "prev"),
                  (["EURUSD", "news"], "news"),
                  (["EURUSD", "next", "day"], "next day"),
                  (["EURUSD", "next", "week"], "next week"),
                  (["EURUSD", "next", "month"], "next month"),
                  (["EURUSD", "prev", "day"], "prev day"),
                  (["EURUSD", "prev", "week"], "prev week"),
                  (["EURUSD", "prev", "month"], "prev month"),
                  (["EURUSD", "current", "day"], "current day"),
                  (["EURUSD", "current", "week"], "current week"),
                  (["EURUSD", "current", "month"], "current month"),
              ):
                  request = calendar_cli.parse_calendar_cli_request(args)
                  assert request["scope"] == expected
              assert calendar_cli.parse_calendar_cli_request(
                  ["EURUSD", "next", "day", "refresh"]
              )["refresh"] is True
              for invalid in (
                  ["EURUSD", "next", "refresh"],
                  ["EURUSD", "prev", "refresh"],
                  ["EURUSD", "news", "refresh"],
              ):
                  try:
                      calendar_cli.parse_calendar_cli_request(invalid)
                  except calendar.CalendarInputError:
                      pass
                  else:
                      raise AssertionError(f"refresh must be rejected for {invalid[1]}")
              start, end = domain.resolve_relative_scope_interval(
                  "current week", dt("2026-10-07T12:30:00Z")
              )
              assert (start, end) == (
                  dt("2026-10-05T00:00:00Z"),
                  dt("2026-10-12T00:00:00Z"),
              )
              start, end = domain.resolve_relative_scope_interval(
                  "next month", dt("2026-10-07T12:30:00Z")
              )
              assert (start, end) == (
                  dt("2026-11-01T00:00:00Z"),
                  dt("2026-12-01T00:00:00Z"),
              )

              active_events = [
                  {
                      "event_id": "active", "symbol": "EURUSD",
                      "timestamp": "2026-10-07T12:30:00Z", "source": "forexfactory",
                      "details": {"currency": "EUR"},
                  },
                  {
                      "event_id": "expired", "symbol": "EURUSD",
                      "timestamp": "2026-10-07T12:29:00Z", "source": "forexfactory",
                      "details": {"currency": "EUR"},
                  },
              ]
              assert [event["event_id"] for event in domain.query_ongoing_events(
                  active_events, "EURUSD", dt("2026-10-07T12:30:30Z")
              )] == ["active"]
          finally:
              domain.utc_now = fixed_utc_now

          # Open-start and open-end positional open-start/open-end scope forms share the canonical UTC interval model.
          fixed_utc_now = domain.utc_now
          try:
              domain.utc_now = lambda: dt("2026-10-06T12:00:00Z")
              open_start = domain.parse_scope("-2026.10.20")
              assert domain.is_open_start_scope(open_start)
              open_start_end = domain.resolve_open_start_scope(
                  {
                      "events": [{
                          "event_id": "test:open-start",
                          "symbol": "USD",
                          "source": "forexfactory",
                          "timestamp": "2026-10-06T08:00:00Z",
                          "suppressed_for": [],
                          "details": {"currency": "USD"},
                      }]
                  },
                  "USD",
                  open_start,
              )
              assert open_start_end == (
                  dt("2026-10-06T08:00:00Z"),
                  dt("2026-10-21T00:00:00Z"),
              )

              open_end = domain.parse_scope("2026.10.06-")
              assert domain.is_open_end_scope(open_end)
              assert domain.resolve_open_end_scope(open_end) == (
                  dt("2026-10-06T00:00:00Z"),
                  dt("2026-10-06T12:00:00Z"),
              )
              open_end_time = domain.parse_scope("2026.10.06 10:30-")
              assert domain.resolve_open_end_scope(open_end_time) == (
                  dt("2026-10-06T10:30:00Z"),
                  dt("2026-10-06T12:00:00Z"),
              )

              range_request = calendar_cli.parse_calendar_cli_request(
                  ["EURUSD", "2026.10.06-"]
              )
              assert range_request["scope"] == "2026.10.06-"
              range_request = calendar_cli.parse_calendar_cli_request(
                  ["EURUSD", "2026.10.06 10:30-"]
              )
              assert range_request["scope"] == "2026.10.06 10:30-"
              assert domain.resolve_scope_interval("2026.10.06-") == (
                  dt("2026-10-06T00:00:00Z"),
                  dt("2026-10-06T12:00:00Z"),
              )
          finally:
              domain.utc_now = fixed_utc_now

          one_day = calendar.parse_date("2026.04.03")
          two_day_end = calendar.parse_date("2026.04.04")
          assert providers.build_forexfactory_query(one_day, two_day_end) == "day=apr3.2026"
          range_end = calendar.parse_date("2026.04.11")
          assert providers.build_forexfactory_query(one_day, range_end) == "range=apr3.2026-apr10.2026"
          html = """<html><body>
          <div>Calendar Time Zone: Europe/Budapest (GMT +2)</div>
          <table><tbody>
          <tr class="calendar__row calendar_row" data-eventid="1001">
            <td class="calendar__cell calendar__date date">Mon Oct 5</td>
            <td class="calendar__cell calendar__time time">9:00am</td>
            <td class="calendar__cell calendar__currency currency">EUR</td>
            <td class="calendar__cell calendar__impact impact"><span title="High Impact Expected" class="high"></span></td>
            <td class="calendar__cell calendar__event event"><a href="/calendar?day=oct5.2026&event=1001"><span class="calendar__event-title">ECB Test Event</span></a></td>
            <td class="calendar__cell calendar__actual actual"></td>
            <td class="calendar__cell calendar__forecast forecast">1.2%</td>
            <td class="calendar__cell calendar__previous previous">1.0%</td>
          </tr>
          </tbody></table></body></html>"""
          helper_row_html = """<html><body>
          <div>Calendar Time Zone: Europe/Budapest (GMT +2)</div>
          <table><tbody>
          <tr class="calendar__row calendar_row"><td class="calendar__cell calendar__date date">Mon Oct 5</td></tr>
          <tr class="calendar__row calendar_row" data-event-id="1002">
            <td class="calendar__cell calendar__date date">Mon Oct 5</td>
            <td class="calendar__cell calendar__time time">10:00am</td>
            <td class="calendar__cell calendar__currency currency">USD</td>
            <td class="calendar__cell calendar__event event"><span class="calendar__event-title">US Test Event</span></td>
          </tr></tbody></table></body></html>"""
          helper_rows = calendar.parse_forexfactory_html_events(
              helper_row_html,
              dt("2026-10-04T00:00:00Z"),
              dt("2026-10-06T00:00:00Z"),
          )
          assert [row["id"] for row in helper_rows] == ["1002"]
          assert helper_rows[0]["currency"] == "USD"

          ff_rows = calendar.parse_forexfactory_html_events(
              html,
              dt("2026-10-04T00:00:00Z"),
              dt("2026-10-06T00:00:00Z"),
          )
          assert len(ff_rows) == 1
          assert ff_rows[0]["id"] == "1001"
          assert ff_rows[0]["currency"] == "EUR"
          assert ff_rows[0]["name"] == "ECB Test Event"
          assert ff_rows[0]["impactName"] == "high"
          assert "url" not in ff_rows[0]

          # Provider-row CSS classes are advisory: an event-ID-bearing row
          # must still be parsed without depending on its CSS row class.
          id_only_html = """<html><body>
          <div>Calendar Time Zone: Europe/Budapest (GMT +2)</div>
          <table><tbody>
          <tr data-event-id="1004">
            <td class="calendar__cell calendar__date date">Mon Oct 5</td>
            <td class="calendar__cell calendar__time time">12:00pm</td>
            <td class="calendar__cell calendar__currency currency">USD</td>
            <td class="calendar__cell calendar__event event">
              <span class="calendar__event-title">ID Only Test Event</span>
            </td>
          </tr>
          </tbody></table></body></html>"""
          id_only_rows = calendar.parse_forexfactory_html_events(
              id_only_html,
              dt("2026-10-04T00:00:00Z"),
              dt("2026-10-06T00:00:00Z"),
          )
          assert len(id_only_rows) == 1
          assert id_only_rows[0]["id"] == "1004"

          medium_html = """<html><body>
          <div>Calendar Time Zone: Europe/Budapest (GMT +2)</div>
          <tr class="calendar__row calendar_row" data-eventid="1003">
            <td class="calendar__cell calendar__date date">Mon Oct 5</td>
            <td class="calendar__cell calendar__time time">11:00am</td>
            <td class="calendar__cell calendar__currency currency">USD</td>
