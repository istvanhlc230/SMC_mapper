name: Calendar Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile calendar.py
      - name: Calendar unit/runtime contract tests
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import io
          import contextlib
          import sys
          import tempfile
          from datetime import datetime, timedelta, timezone

          import calendar

          def dt(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          assert calendar.validate_symbol("EURUSD") == "EURUSD"
          assert calendar.validate_symbol("USDGBP") == "USDGBP"
          assert calendar.validate_symbol("HUF") == "HUF"
          assert calendar.validate_symbol("NVDA") == "NVDA"
          one_day = calendar.parse_date("2026.04.03")
          two_day_end = calendar.parse_date("2026.04.04")
          assert calendar.build_forexfactory_query(one_day, two_day_end) == "day=apr3.2026"
          range_end = calendar.parse_date("2026.04.11")
          assert calendar.build_forexfactory_query(one_day, range_end) == "range=apr3.2026-apr10.2026"
          html = """<html><body>
          <div>Calendar Time Zone: Europe/Budapest (GMT +2)</div>
          <table><tbody>
          <tr class="calendar__row calendar_row" data-eventid="1001">
            <td class="calendar__cell calendar__date date">Mon Oct 5</td>
            <td class="calendar__cell calendar__time time">9:00am</td>
            <td class="calendar__cell calendar__currency currency">EUR</td>
            <td class="calendar__cell calendar__impact impact"><span title="High Impact Expected" class="high"></span></td>
            <td class="calendar__cell calendar__event event"><a href="/calendar?day=oct5.2026&event=1001"><span class="calendar__event-title">ECB Test Event</span></a></td>
            <td class="calendar__cell calendar__actual actual"></td>
            <td class="calendar__cell calendar__forecast forecast">1.2%</td>
            <td class="calendar__cell calendar__previous previous">1.0%</td>
          </tr>
          </tbody></table></body></html>"""
          helper_row_html = """<html><body>
          <div>Calendar Time Zone: Europe/Budapest (GMT +2)</div>
          <table><tbody>
          <tr class="calendar__row calendar_row"><td class="calendar__cell calendar__date date">Mon Oct 5</td></tr>
          <tr class="calendar__row calendar_row" data-event-id="1002">
            <td class="calendar__cell calendar__date date">Mon Oct 5</td>
            <td class="calendar__cell calendar__time time">10:00am</td>
            <td class="calendar__cell calendar__currency currency">USD</td>
            <td class="calendar__cell calendar__event event"><span class="calendar__event-title">US Test Event</span></td>
          </tr></tbody></table></body></html>"""
          helper_rows = calendar.parse_forexfactory_html_events(
              helper_row_html,
              dt("2026-10-04T00:00:00Z"),
              dt("2026-10-06T00:00:00Z"),
          )
          assert [row["id"] for row in helper_rows] == ["1002"]
          assert helper_rows[0]["currency"] == "USD"

          ff_rows = calendar.parse_forexfactory_html_events(
              html,
              dt("2026-10-04T00:00:00Z"),
              dt("2026-10-06T00:00:00Z"),
          )
          assert len(ff_rows) == 1
          assert ff_rows[0]["id"] == "1001"
          assert ff_rows[0]["currency"] == "EUR"
          assert ff_rows[0]["name"] == "ECB Test Event"
          assert ff_rows[0]["impactName"] == "high"
          assert "url" not in ff_rows[0]

          # Provider-row CSS classes are advisory: an event-ID-bearing row
          # must still be parsed without depending on its CSS row class.
          id_only_html = """<html><body>
          <div>Calendar Time Zone: Europe/Budapest (GMT +2)</div>
          <table><tbody>
          <tr data-event-id="1004">
            <td class="calendar__cell calendar__date date">Mon Oct 5</td>
            <td class="calendar__cell calendar__time time">12:00pm</td>
            <td class="calendar__cell calendar__currency currency">USD</td>
            <td class="calendar__cell calendar__event event">
              <span class="calendar__event-title">ID Only Test Event</span>
            </td>
          </tr>
          </tbody></table></body></html>"""
          id_only_rows = calendar.parse_forexfactory_html_events(
              id_only_html,
              dt("2026-10-04T00:00:00Z"),
              dt("2026-10-06T00:00:00Z"),
          )
          assert len(id_only_rows) == 1
          assert id_only_rows[0]["id"] == "1004"

          medium_html = """<html><body>
          <div>Calendar Time Zone: Europe/Budapest (GMT +2)</div>
          <tr class="calendar__row calendar_row" data-eventid="1003">
            <td class="calendar__cell calendar__date date">Mon Oct 5</td>
            <td class="calendar__cell calendar__time time">11:00am</td>
            <td class="calendar__cell calendar__currency currency">USD</td>
            <td class="calendar__cell calendar__impact impact calendar__impact--medium"></td>
            <td class="calendar__cell calendar__event event"><span class="calendar__event-title">Medium Test Event</span></td>
          </tr></body></html>"""
          medium_rows = calendar.parse_forexfactory_html_events(
              medium_html,
              dt("2026-10-04T00:00:00Z"),
              dt("2026-10-06T00:00:00Z"),
          )
          assert medium_rows[0]["impactName"] == "medium"

          for raw_class, expected_impact in (
              ("icon--ff-impact-red", "high"),
              ("icon--ff-impact-ora", "medium"),
              ("icon--ff-impact-yel", "low"),
              ("icon--ff-impact-grn", "low"),
              ("icon--ff-impact-gry", "holiday"),
          ):
              assert calendar._classify_forexfactory_impact({raw_class}) == expected_impact

          normalized_ff = calendar.normalize_provider_event(ff_rows[0])
          assert normalized_ff["timestamp"] == "2026-10-05T07:00:00Z"
          assert normalized_ff["details"]["impact"] == "HIGH"
          assert "url" not in normalized_ff["details"]

          detail_json = json.dumps({
              "data": {
                  "specs": [
                      {"order": -1, "title": "Source", "html": "<a href='https://example.com'>Source text</a>"},
                      {"order": 7, "title": "Measures", "html": "Measures text"},
                      {"order": 7, "title": "Frequency", "html": "Monthly"},
                  ]
              }
          })
          original_fetch_url = calendar.fetch_url
          try:
              calendar.fetch_url = lambda _url: detail_json
              specs = calendar.fetch_forexfactory_event_detail("146900")
              assert [item["title"] for item in specs] == ["Source", "Measures", "Frequency"]
              assert [item["order"] for item in specs] == [-1, 7, 7]
              assert specs[0]["html"].startswith("<a href=")
          finally:
              calendar.fetch_url = original_fetch_url

          normalized_ff["details"]["specs"] = specs
          calendar.validate_calendar_document({
              "schema_version": 2,
              "events": [normalized_ff],
              "coverage": [],
              "watermarks": {},
          })

          # fetch_forexfactory must obtain Detail after interval filtering and
          # must not route a Detail failure through the calendar HTML fallback.
          original_fetch_url = calendar.fetch_url
          original_detail_fetch = calendar.fetch_forexfactory_event_detail
          calendar_detail_payload = """<html><body>
          <div>Calendar Time Zone: Europe/Budapest (GMT +2)</div>
          <script>{}</script>
          </body></html>""".format(json.dumps({"days": [{"events": [{
              "id": "146901",
              "dateline": int(dt("2026-10-05T07:00:00Z").timestamp()),
              "currency": "USD",
              "name": "Fetched Detail Event",
              "impactName": "High Impact Expected",
              "actual": None,
              "forecast": None,
              "previous": None,
          }]}]}))
          detail_by_id = {
              "146901": [
                  {"order": -3, "title": "Source", "html": "<a href='https://example.com/source'>Example</a>"},
                  {"order": 2, "title": "Why Traders Care", "html": "Traders care."},
              ]
          }
          try:
              calendar.fetch_url = lambda _url: calendar_detail_payload
              calendar.fetch_forexfactory_event_detail = lambda event_id: detail_by_id[event_id]
              acquired = calendar.fetch_forexfactory(
                  dt("2026-10-05T00:00:00Z"),
                  dt("2026-10-06T00:00:00Z"),
              )
              assert len(acquired) == 1
              assert acquired[0]["event_id"] == "forexfactory:146901"
              assert [x["title"] for x in acquired[0]["details"]["specs"]] == ["Source", "Why Traders Care"]
              assert "url" not in acquired[0]["details"]
          finally:
              calendar.fetch_url = original_fetch_url
              calendar.fetch_forexfactory_event_detail = original_detail_fetch

          detail_failure_original_detail_fetch = calendar.fetch_forexfactory_event_detail
          try:
              calendar.fetch_url = lambda _url: calendar_detail_payload
              calendar.fetch_forexfactory_event_detail = lambda _event_id: (_ for _ in ()).throw(
                  calendar.ProviderError("synthetic detail failure")
              )
              try:
                  calendar.fetch_forexfactory(
                      dt("2026-10-05T00:00:00Z"),
                      dt("2026-10-06T00:00:00Z"),
                  )
                  raise AssertionError("Detail failure was swallowed")
              except calendar.ProviderError as exc:
                  assert "synthetic detail failure" in str(exc)
          finally:
              calendar.fetch_url = original_fetch_url
              calendar.fetch_forexfactory_event_detail = detail_failure_original_detail_fetch

          cleartext_specs = calendar.format_cleartext_details({
              "currency": "USD",
              "impact": "HIGH",
              "actual": None,
              "forecast": None,
              "previous": None,
              "specs": [
                  {"order": -1, "title": "Source", "html": "<a href='https://example.com'>Example Source</a>"},
                  {"order": 1, "title": "Measures", "html": "Monthly data."},
              ],
          })
          assert any("Source   : Example Source" in line for line in cleartext_specs)
          assert any("Measures : Monthly data." in line for line in cleartext_specs)

          # Provider Detail HTML may be entity-escaped. Cleartext must decode
          # entities before stripping markup, while calendar.json still retains
          # the original provider HTML.
          escaped_detail = (
              "FF Notice &lt;img class=&quot;svg-img svg-img--misc-star&quot; "
              "width=&quot;12&quot; height=&quot;11&quot; src=&quot;resources/svg/images/misc/star.svg&quot;&gt;: "
              "Event added to calendar 176 minutes before release time; "
              "Why Traders&lt;br&gt;Care: Federal Reserve members vote on rates"
          )
          escaped_lines = calendar.format_cleartext_details({
              "specs": [{"order": 1, "title": "Provider Detail", "html": escaped_detail}],
          })
          escaped_rendered = "\n".join(escaped_lines)
          assert "<img" not in escaped_rendered
          assert "svg-img" not in escaped_rendered
          assert "<br>" not in escaped_rendered
          assert "FF Notice : Event added to calendar 176 minutes before release time" in escaped_rendered
          assert "Why Traders\nCare:" in escaped_rendered

          double_escaped_detail = (
              "FF Notice &amp;lt;img class=&amp;quot;svg-img&amp;quot;&amp;gt;: Event added; "
              "Why Traders&amp;lt;br&amp;gt;Care: policy clues"
          )
          double_escaped_lines = calendar.format_cleartext_details({
              "specs": [{"order": 1, "title": "Provider Detail", "html": double_escaped_detail}],
          })
          double_escaped_rendered = "\n".join(double_escaped_lines)
          assert "<img" not in double_escaped_rendered
          assert "&lt;img" not in double_escaped_rendered
          assert "<br>" not in double_escaped_rendered
          assert "&lt;br&gt;" not in double_escaped_rendered
          assert "FF Notice : Event added" in double_escaped_rendered
          assert "Why Traders\nCare:" in double_escaped_rendered

          literal_html_detail = (
              "FF Notice <img class=\"svg-img svg-img--misc-star\">: Event added; "
              "Why Traders<br>Care: policy clues"
          )
          literal_lines = calendar.format_cleartext_details({
              "specs": [{
                  "order": 1,
                  "title": "Why Traders<br>Care",
                  "html": literal_html_detail,
              }],
          })
          literal_rendered = "\n".join(literal_lines)
          assert "Why Traders<br>Care" not in literal_rendered
          assert "Why Traders\nCare" in literal_rendered
          assert "<img" not in literal_rendered
          assert "svg-img" not in literal_rendered
          assert "<br>" not in literal_rendered
          assert "FF Notice : Event added" in literal_rendered
          assert "Why Traders Care:" in literal_rendered

          # Detail acquisition must use bounded parallel workers while preserving
          # the original event order.
          original_executor = calendar.ThreadPoolExecutor
          executor_config = {}
          class RecordingExecutor:
              def __init__(self, max_workers=None, thread_name_prefix=None):
                  executor_config["max_workers"] = max_workers
                  self.max_workers = max_workers
              def __enter__(self):
                  return self
              def __exit__(self, exc_type, exc_value, tb):
                  return False
              def map(self, function, iterable):
                  return [function(item) for item in iterable]
          original_detail_fetch = calendar.fetch_forexfactory_event_detail
          try:
              calendar.ThreadPoolExecutor = RecordingExecutor
              seen_detail_ids = []
              def fake_detail(event_id):
                  seen_detail_ids.append(event_id)
                  return [{"order": 1, "title": "Source", "html": event_id}]
              calendar.fetch_forexfactory_event_detail = fake_detail
              original_build_query = calendar.build_forexfactory_query
              original_fetch_url = calendar.fetch_url
              try:
                  calendar.build_forexfactory_query = lambda _start, _end: "day=oct5.2026"
                  calendar.fetch_url = lambda _url: json.dumps([{
                      "date": {"date": "2026-10-05"},
                      "events": [
                          {"id": "101", "dateline": int(dt("2026-10-05T07:00:00Z").timestamp()), "currency": "USD", "name": "A", "impactName": "Low Impact Expected", "actual": None, "forecast": None, "previous": None},
                          {"id": "102", "dateline": int(dt("2026-10-05T08:00:00Z").timestamp()), "currency": "USD", "name": "B", "impactName": "Low Impact Expected", "actual": None, "forecast": None, "previous": None},
                      ]
                  }])
                  fetched_events = calendar.fetch_forexfactory(
                      dt("2026-10-05T00:00:00Z"),
                      dt("2026-10-06T00:00:00Z"),
                  )
                  assert executor_config["max_workers"] == 2
                  assert seen_detail_ids == ["101", "102"]
                  assert [event["details"]["specs"][0]["html"] for event in fetched_events] == ["101", "102"]
              finally:
                  calendar.build_forexfactory_query = original_build_query
                  calendar.fetch_url = original_fetch_url
          finally:
              calendar.fetch_forexfactory_event_detail = original_detail_fetch
              calendar.ThreadPoolExecutor = original_executor

          # Targeted refresh reacquires the provider event by stable ID and updates
          # mutable provider fields without advancing coverage or watermark state.
          refresh_doc = calendar.build_empty_calendar_document()
          refresh_event = {
              "event_id": "forexfactory:147017",
              "symbol": "USD",
              "asset_type": "forex",
              "event_type": "economic",
              "source": "forexfactory",
              "timestamp": "2026-10-01T12:30:00Z",
              "title": "Unemployment Claims",
              "details": {
                  "currency": "USD",
                  "impact": "MEDIUM",
                  "actual": "198K",
                  "forecast": "201K",
                  "previous": "198K",
                  "specs": [{"order": 1, "title": "Source", "html": "Department of Labor"}],
              },
          }
          refresh_doc["events"] = [refresh_event]
          refresh_doc["watermarks"]["forexfactory|USD"] = {
              "last_successful_at": "2026-10-02T12:31:00Z",
              "last_event_timestamp": "2026-10-01T12:30:00Z",
          }
          refresh_doc["coverage"] = [{
              "provider": "forexfactory",
              "symbol": "USD",
              "start": "2026-10-01T00:00:00Z",
              "end": "2026-10-02T00:00:00Z",
              "status": "COMPLETE",
              "updated_at": "2026-10-02T12:31:00Z",
          }]
          refreshed_event = dict(refresh_event)
          refreshed_event["details"] = dict(refresh_event["details"])
          refreshed_event["details"]["actual"] = "197K"
          refreshed_event["details"]["specs"] = [{"order": 1, "title": "Source", "html": "Department of Labor (latest release)"}]
          original_refresh_fetch = calendar.fetch_forexfactory_event_refresh
          original_refresh_load = calendar.load_calendar_document
          original_refresh_save = calendar.save_calendar_atomic
          saved_refresh_docs = []
          try:
              calendar.fetch_forexfactory_event_refresh = lambda event_id, reference_timestamp: refreshed_event
              calendar.load_calendar_document = lambda: refresh_doc
              calendar.save_calendar_atomic = lambda document: saved_refresh_docs.append(document)
              assert calendar.run_refresh("forexfactory:147017", cleartext=False) == 0
              assert refresh_doc["events"][0]["details"]["actual"] == "197K"
              assert refresh_doc["events"][0]["details"]["specs"][0]["html"] == "Department of Labor (latest release)"
              assert refresh_doc["watermarks"]["forexfactory|USD"]["last_successful_at"] == "2026-10-02T12:31:00Z"
              assert refresh_doc["coverage"][0]["status"] == "COMPLETE"
              assert len(saved_refresh_docs) == 1
          finally:
              calendar.fetch_forexfactory_event_refresh = original_refresh_fetch
              calendar.load_calendar_document = original_refresh_load
              calendar.save_calendar_atomic = original_refresh_save

          assert calendar.parse_request(["refresh", "forexfactory:147017"])["operation"] == "REFRESH"
          try:
              calendar.parse_request(["refresh", "USD", "forexfactory:147017"])
          except calendar.CalendarInputError:
              pass
          else:
              raise AssertionError("refresh accepted an invalid argument count")

          # Legacy schema-2 ForexFactory coverage without Detail specs is incomplete
          # for the requested overlap and must be reacquired.
          legacy_doc = calendar.build_empty_calendar_document()
          legacy_doc["events"] = [{
              "event_id": "forexfactory:legacy",
              "symbol": "USD",
              "asset_type": "forex",
              "event_type": "economic",
              "source": "forexfactory",
              "timestamp": "2026-10-05T12:00:00Z",
              "title": "Legacy Event",
              "details": {
                  "currency": "USD",
                  "impact": "HIGH",
                  "actual": None,
                  "forecast": None,
                  "previous": None,
                  "url": None,
              },
          }]
          legacy_doc["coverage"] = [{
              "provider": "forexfactory",
              "symbol": "USD",
              "start": "2026-10-05T00:00:00Z",
              "end": "2026-10-06T00:00:00Z",
              "status": "COMPLETE",
              "updated_at": "2026-10-05T00:00:00Z",
          }]
          assert calendar.find_uncovered_intervals(
              legacy_doc,
              "forexfactory",
              "USD",
              dt("2026-10-05T00:00:00Z"),
              dt("2026-10-06T00:00:00Z"),
          ) == [(dt("2026-10-05T00:00:00Z"), dt("2026-10-06T00:00:00Z"))]

          for raw_impact, expected_impact in (
              ("High Impact Expected", "HIGH"),
              ("Med Impact Expected", "MEDIUM"),
              ("Medium Impact Expected", "MEDIUM"),
              ("Low Impact Expected", "LOW"),
              ("Non-Economic", "HOLIDAY"),
          ):
              structured_raw = {
                  "id": f"structured-{expected_impact}",
                  "dateline": int(dt("2026-10-05T07:00:00Z").timestamp()),
                  "currency": "USD",
                  "name": "Structured Impact Test",
                  "url": "/calendar/event/structured-impact-test/",
                  "impactName": raw_impact,
                  "actual": None,
                  "forecast": None,
                  "previous": None,
              }
              assert calendar.normalize_provider_event(structured_raw)["details"]["impact"] == expected_impact

          for raw_title, expected_impact in (
              ("High Impact Expected", "HIGH"),
              ("Med Impact Expected", "MEDIUM"),
              ("Low Impact Expected", "LOW"),
              ("Non-Economic", "HOLIDAY"),
          ):
              structured_raw = {
                  "id": f"title-{expected_impact}",
                  "dateline": int(dt("2026-10-05T07:00:00Z").timestamp()),
                  "currency": "USD",
                  "name": "Structured Impact Title Test",
                  "impactTitle": raw_title,
                  "actual": None,
                  "forecast": None,
                  "previous": None,
              }
              assert calendar.normalize_provider_event(structured_raw)["details"]["impact"] == expected_impact

          for raw_class, expected_impact in (
              ("impact-red", "HIGH"),
              ("icon--ff-impact-red", "HIGH"),
              ("impact-orange", "MEDIUM"),
              ("icon--ff-impact-ora", "MEDIUM"),
              ("impact-yellow", "LOW"),
              ("icon--ff-impact-yel", "LOW"),
              ("impact-green", "LOW"),
              ("icon--ff-impact-grn", "LOW"),
              ("impact-grey", "HOLIDAY"),
              ("icon--ff-impact-grey", "HOLIDAY"),
          ):
              structured_raw = {
                  "id": f"class-{expected_impact}",
                  "dateline": int(dt("2026-10-05T07:00:00Z").timestamp()),
                  "currency": "USD",
                  "name": "Structured Class Test",
                  "impactClass": raw_class,
                  "actual": None,
                  "forecast": None,
                  "previous": None,
              }
              assert calendar.normalize_provider_event(structured_raw)["details"]["impact"] == expected_impact

          assert calendar.__version__ == "2.3.7"
          assert f"Calendar CLI v{calendar.__version__}" in calendar.HELP_TEXT

          # Cleartext output must render normalized details as readable fields,
          # not as an internal JSON dictionary representation.
          cleartext_event = {
              "event_id": "forexfactory:cleartext",
              "symbol": "EUR",
              "asset_type": "forex",
              "event_type": "economic",
              "source": "forexfactory",
              "timestamp": "2026-10-05T07:15:00Z",
              "title": "Spanish Services PMI",
              "details": {
                  "currency": "EUR",
                  "impact": "LOW",
                  "actual": None,
                  "forecast": "57.1",
                  "previous": "57.8",
              },
          }
          cleartext_out = io.StringIO()
          with contextlib.redirect_stdout(cleartext_out):
              calendar.output_query_result(
                  "OK", "EURUSD", [cleartext_event], [], cleartext=True
              )
          rendered = cleartext_out.getvalue()
          assert 'Details   : {"currency"' not in rendered
          assert "Details   :\n" in rendered
          assert "  Currency : EUR\n" in rendered
          assert "  Impact   : LOW\n" in rendered
          assert "  Actual   : N/A\n" in rendered
          assert "  Forecast : 57.1\n" in rendered
          assert "  Previous : 57.8\n" in rendered

          # Cleartext event blocks are separated by whitespace only; no closing rule is emitted.
          second_cleartext_event = dict(cleartext_event)
          second_cleartext_event["event_id"] = "forexfactory:cleartext-2"
          cleartext_out = io.StringIO()
          with contextlib.redirect_stdout(cleartext_out):
              calendar.output_query_result(
                  "OK", "EURUSD", [cleartext_event, second_cleartext_event], [], cleartext=True
              )
          rendered_blocks = cleartext_out.getvalue()
          assert "-----------------------------------------------" not in rendered_blocks
          assert "Event ID  : forexfactory:cleartext\n\n--- EVENT 02" in rendered_blocks

          # Explicit bare delete must recover from an incompatible legacy cache.
          original_root = calendar.DATA_ROOT
          original_file = calendar.CALENDAR_FILE
          try:
              with tempfile.TemporaryDirectory() as tmp:
                  calendar.DATA_ROOT = tmp
                  calendar.CALENDAR_FILE = os.path.join(tmp, "calendar.json")
                  with open(calendar.CALENDAR_FILE, "w", encoding="utf-8") as handle:
                      json.dump({"schema_version": 1, "events": [], "coverage": [], "watermarks": {}}, handle)
                  assert calendar.run_delete(None, None) == 0
                  reset_document = calendar.load_calendar_document()
                  assert reset_document["schema_version"] == calendar.SCHEMA_VERSION
                  assert reset_document["events"] == []
                  assert reset_document["coverage"] == []
                  assert reset_document["watermarks"] == {}
          finally:
              calendar.DATA_ROOT = original_root
              calendar.CALENDAR_FILE = original_file

          assert calendar.parse_request(["EURUSD", "next"])["scope"] == "next"
          assert calendar.parse_request(["EURUSD", "latest"])["scope"] == "latest"

          next_doc = calendar.build_empty_calendar_document()
          next_doc["events"] = [
              {"event_id":"forexfactory:past-usd","symbol":"USD","asset_type":"forex","event_type":"economic","source":"forexfactory","timestamp":"2026-10-03T09:00:00Z","title":"Past USD","details":{"currency":"USD","impact":"HIGH"}},
