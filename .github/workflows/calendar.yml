              providers.ThreadPoolExecutor = original_executor

          # Forced refresh overlaps independent provider requests instead of serially awaiting each network source.
          concurrent_refresh_providers = domain.resolve_applicable_providers("EURUSD")
          original_concurrent_fetch = operations._fetch_provider_events
          concurrent_started = set()
          concurrent_started_lock = threading.Lock()
          all_concurrent_providers_started = threading.Event()

          def synchronized_provider_fetch(provider, symbol, start, end, **kwargs):
              with concurrent_started_lock:
                  concurrent_started.add(provider)
                  if len(concurrent_started) == len(concurrent_refresh_providers):
                      all_concurrent_providers_started.set()
              assert all_concurrent_providers_started.wait(timeout=5), (
                  "forced refresh serialized independent provider network requests"
