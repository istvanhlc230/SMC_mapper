name: SMC Mapper Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run test suite when tests exist
        shell: bash
        run: |
          if find test -type f -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m pytest -q test
          else
            echo "No pytest tests are present yet; skipping test execution."
          fi
