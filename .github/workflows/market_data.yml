name: Market Data Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  market-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile market_data.py && python -m compileall -q COMMON MARKET_DATA
      - name: Market Data range contract tests
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          import urllib.error
          import socket
          import subprocess
          import sys

          no_args_help = subprocess.run(
              [sys.executable, "market_data.py"],
              capture_output=True,
              text=True,
          )
          assert no_args_help.returncode == 0, no_args_help.stderr
          assert "--symbol" in no_args_help.stdout
          assert "--timeframes" in no_args_help.stdout

          from MARKET_DATA.provider import LSEMarketDataProvider, create_provider
          from MARKET_DATA.cli import parse_market_data_request
          from MARKET_DATA.models import MarketDataRequest, ProviderCandle
          from MARKET_DATA.service import resolve_acquisition_range
          def dt(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          # --table is the only human-readable output option; --cleartext is not an alias.
          from decimal import Decimal
          from MARKET_DATA.cli import run as run_market_data_request
          from MARKET_DATA.models import NormalizedCandle, VolumeState
          from MARKET_DATA.protocol import format_table

          table_request = parse_market_data_request([
              "--symbol", "EURUSD", "--timeframes", "M1", "--table"
          ])
          assert table_request.table is True
          try:
              parse_market_data_request([
                  "--symbol", "EURUSD", "--timeframes", "M1", "--cleartext"
              ])
          except ValueError as error:
              assert "--cleartext is no longer supported" in str(error)
              assert "--table" in str(error)
          else:
              raise AssertionError("--cleartext must be rejected rather than accepted as an alias")

          sample_candle = NormalizedCandle(
              candle_id="EURUSD_M1_2026-10-10T00:00:00Z",
              timestamp=dt("2026-10-10T00:00:00Z"),
              completion_time=dt("2026-10-10T00:01:00Z"),
              open_price=Decimal("1.1"),
              high_price=Decimal("1.2"),
              low_price=Decimal("1.0"),
              close_price=Decimal("1.15"),
              volume=VolumeState(False, None, False, None, None, False, None, None),
          )
          sample_entries = {"M1": [(sample_candle, True)]}
          rendered_table = format_table("EURUSD", sample_entries)
          assert "MARKET DATA | EURUSD" in rendered_table
          assert "TIMEFRAME | M1 | CANDLES 1" in rendered_table
          assert "2026-10-10 00:00:00" in rendered_table
          assert "1.15" in rendered_table

          with patch("MARKET_DATA.cli.create_provider"), patch(
              "MARKET_DATA.cli.get_candles", return_value={"M1": [sample_candle]}
          ), patch("builtins.print") as captured_stdout:
              assert run_market_data_request(table_request) == 0
          assert "TIMEFRAME | M1 | CANDLES 1" in captured_stdout.call_args.args[0]

          default_request = parse_market_data_request([
              "--symbol", "EURUSD", "--timeframes", "M1"
          ])
          assert default_request.table is False
          with patch("MARKET_DATA.cli.create_provider"), patch(
              "MARKET_DATA.cli.get_candles", return_value={"M1": [sample_candle]}
          ), patch("builtins.print") as captured_stdout:
              assert run_market_data_request(default_request) == 0
          assert captured_stdout.call_args.args[0].startswith("timeframe,time,")
          assert "MARKET DATA | EURUSD" not in captured_stdout.call_args.args[0]

          from COMMON.date_time import DateTimeScopeParser, DateTimeScopeError
          from COMMON.atomic_file import atomic_write_text
          from COMMON.http_client import HttpClient, HttpRequestError
          import COMMON.http_client as shared_http_client

          # The shared parser is deterministic, strict, and independent of consumer modules.
          shared_parser = DateTimeScopeParser(reference_time=dt("2026-10-06T12:00:00Z"))

          # Resolving an open-end scope must use the parser's captured UTC time.
          captured_open_end = shared_parser.parse("2026.10.06 10:30-")
          captured_start, captured_end = captured_open_end.resolve_interval()
          assert captured_start == dt("2026-10-06T10:30:00Z")
          assert captured_end == dt("2026-10-06T12:00:00Z")

          # Shared atomic replacement commits complete content and preserves the old
          # destination if the final atomic replacement fails.
          with TemporaryDirectory() as temporary_directory:
              destination = Path(temporary_directory) / "shared-state.txt"
              destination.write_text("old", encoding="utf-8")
              atomic_write_text(destination, "new", retry_limit=1)
              assert destination.read_text(encoding="utf-8") == "new"
              with patch("COMMON.atomic_file.os.replace", side_effect=OSError("synthetic replace failure")):
                  try:
                      atomic_write_text(destination, "uncommitted", retry_limit=1)
                  except OSError:
                      pass
                  else:
                      raise AssertionError("atomic replacement failure must be propagated")
              assert destination.read_text(encoding="utf-8") == "new"
              assert not list(Path(temporary_directory).glob(".atomic.*.tmp"))

          # HTTP error text and traceback context must not leak URLs or credentials.
          with patch(
              "COMMON.http_client.urllib.request.urlopen",
              side_effect=urllib.error.URLError("https://internal.invalid/?token=synthetic-secret"),
          ):
              try:
                  HttpClient.get(
                      "https://internal.invalid/?token=synthetic-secret",
                      response_format="text",
                  )
              except HttpRequestError as error:
                  assert "synthetic-secret" not in str(error)
                  assert "internal.invalid" not in str(error)
                  assert error.__cause__ is None
              else:
                  raise AssertionError("HTTP transport error must be reported")

          # IPv4 is attempted before IPv6 even when DNS lists IPv6 first. This
          # prevents broken local IPv6 routes from delaying reachable IPv4 APIs.
          connection_attempts = []
          class SyntheticSocket:
              def __init__(self, address_family, socket_type, protocol):
                  self.address_family = address_family
              def settimeout(self, timeout):
                  self.timeout = timeout
              def bind(self, source_address):
                  self.source_address = source_address
              def connect(self, address):
                  connection_attempts.append(self.address_family)
                  if self.address_family == socket.AF_INET6:
                      raise OSError("synthetic IPv6 route failure")
              def close(self):
                  pass

          synthetic_address_info = [
              (socket.AF_INET6, socket.SOCK_STREAM, socket.IPPROTO_TCP, "", ("2001:db8::1", 443, 0, 0)),
              (socket.AF_INET, socket.SOCK_STREAM, socket.IPPROTO_TCP, "", ("192.0.2.1", 443)),
          ]
          with patch("COMMON.http_client.socket.getaddrinfo", return_value=synthetic_address_info), patch(
              "COMMON.http_client.socket.socket", SyntheticSocket
          ):
              connected_socket = shared_http_client._ipv4_first_create_connection(
                  ("example.invalid", 443), timeout=5
              )
          assert connected_socket.address_family == socket.AF_INET
          assert connection_attempts == [socket.AF_INET]

          # IPv6 remains a fallback when no IPv4 address can connect.
          connection_attempts.clear()
          class SyntheticFallbackSocket(SyntheticSocket):
              def connect(self, address):
                  connection_attempts.append(self.address_family)
                  if self.address_family == socket.AF_INET:
                      raise OSError("synthetic IPv4 route failure")
          with patch("COMMON.http_client.socket.getaddrinfo", return_value=synthetic_address_info), patch(
              "COMMON.http_client.socket.socket", SyntheticFallbackSocket
          ):
              fallback_socket = shared_http_client._ipv4_first_create_connection(
                  ("example.invalid", 443), timeout=5
              )
          assert fallback_socket.address_family == socket.AF_INET6
          assert connection_attempts == [socket.AF_INET, socket.AF_INET6]

          # Closed scopes use the same captured reference clock.
          assert shared_parser.parse("2026.10.06").end == dt("2026-10-07T00:00:00Z")
          assert shared_parser.parse("2026.10.06 15:30").end == dt("2026-10-06T15:31:00Z")
          assert shared_parser.parse("09:30-11:00").end == dt("2026-10-06T11:00:00Z")
          assert shared_parser.parse("2026.10.06 15:30-").open_end
          assert shared_parser.parse("-2026.10.06 15:30").open_start
          try:
              shared_parser.parse("2026.02.30")
          except DateTimeScopeError:
              pass
          else:
              raise AssertionError("invalid date must be rejected by shared parser")


          # The production CLI/provider boundary must select the canonical LSE adapter.
          assert isinstance(create_provider("lse"), LSEMarketDataProvider)
          try:
              create_provider("yahoo_charts")
          except ValueError:
              pass
          else:
              raise AssertionError("obsolete Yahoo Charts provider must be rejected")

          request = parse_market_data_request([
              "--symbol", "EURUSD",
              "--timeframes", "M1", "M5",
              "2026.10.06-",
          ])
          assert request.start_time == dt("2026-10-06T00:00:00Z")
          assert request.end_time is None
          assert request.current is False
          assert request.last_closed_only is False

          open_end_request = parse_market_data_request([
              "--symbol", "EURUSD",
              "--timeframes", "M1",
              "2026.10.06 15:30-",
          ])
          assert open_end_request.start_time == dt("2026-10-06T15:30:00Z")
          assert open_end_request.end_time is None

          # A date-time range may be split by the shell into tokens around its space.
          explicit_datetime_range = parse_market_data_request([
              "--symbol", "EURUSD",
              "--timeframes", "H1", "M15",
              "2026.10.06", "08:00-2026.10.10", "15:30",
          ])
          assert explicit_datetime_range.start_time == dt("2026-10-06T08:00:00Z")
          assert explicit_datetime_range.end_time == dt("2026-10-10T15:30:00Z")
          assert explicit_datetime_range.timeframes == ["H1", "M15"]

          # Retired flag-based date syntax must fail rather than be silently accepted.
          for legacy_flag in ("--range", "--date", "--time"):
              try:
                  parse_market_data_request([
                      "--symbol", "EURUSD",
                      "--timeframes", "H1",
                      legacy_flag, "2026.10.06",
                  ])
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"retired {legacy_flag} flag must be rejected")

          request = parse_market_data_request([
              "--symbol", "EURUSD",
              "--timeframes", "M1", "M5",
              "-2026.10.20",
          ])
          assert request.start_time is None
          assert request.end_time == dt("2026-10-21T00:00:00Z")
          assert request.current is False
          assert request.last_closed_only is False

          request = parse_market_data_request([
              "--symbol", "EURUSD",
              "--timeframes", "M1",
              "-2026.10.06 05:00",
          ])
          assert request.start_time is None
          assert request.end_time == dt("2026-10-06T05:01:00Z")

          # The old HH.MM compatibility spelling is rejected for open-start scopes too.
          try:
              parse_market_data_request([
                  "--symbol", "EURUSD",
                  "--timeframes", "M1",
                  "-2026.10.06 05.00",
              ])
          except ValueError:
              pass
          else:
              raise AssertionError("open-start HH.MM scope must be rejected")

          # HH.MM is not part of the public scope grammar.
          try:
              parse_market_data_request([
                  "--symbol", "EURUSD",
                  "--timeframes", "M1",
                  "2026.10.05 05.00",
              ])
          except ValueError:
              pass
          else:
              raise AssertionError("explicit HH.MM datetime must be rejected")

          # Future starts are invalid for every positional historical scope form.
          try:
              parse_market_data_request([
                  "--symbol", "EURUSD",
                  "--timeframes", "M1",
                  "2099.01.01-",
              ])
          except ValueError as exc:
              assert "future scope start" in str(exc)
          else:
              raise AssertionError("future open-end start must be rejected")

          try:
              parse_market_data_request([
                  "--symbol", "EURUSD",
                  "--timeframes", "M1",
                  "2099.01.01-2099.01.02",
              ])
          except ValueError as exc:
              assert "future scope start" in str(exc)
          else:
              raise AssertionError("future explicit start must be rejected")

          # --lastclosed cannot be combined with any positional historical scope.
          try:
              parse_market_data_request([
                  "--symbol", "EURUSD",
                  "--timeframes", "M1",
                  "--lastclosed",
                  "2026.10.05",
              ])
          except ValueError as exc:
              assert "lastclosed cannot be combined" in str(exc)
          else:
              raise AssertionError("lastclosed + range must be rejected")

          # main() converts CLI ValueError into a concise non-zero exit result.
          from MARKET_DATA.cli import main
          assert main([
              "--symbol", "EURUSD",
              "--timeframes", "M1",
              "2099.01.01-",
          ]) == 2

          state = {
              "available_start": "2026-09-01T00:00:00Z",
              "available_end": "2026-10-05T07:15:00Z",
              "candles": [],
              "current": None,
          }
          resolved = resolve_acquisition_range(request, "M1", state)
          assert resolved == (
              dt("2026-10-05T07:15:00Z"),
              dt("2026-10-06T05:01:00Z"),
          )

          # Normal incremental mode starts at the next canonical candle interval,
          # while open-start positional scope remains inclusive at available_end.
          incremental_request = parse_market_data_request([
              "--symbol", "EURUSD",
              "--timeframes", "M1",
          ])
          incremental = resolve_acquisition_range(incremental_request, "M1", state)
          assert incremental[0] == dt("2026-10-05T07:16:00Z")
          assert incremental[1] is not None
          assert incremental[1] > incremental[0]

          missing = {
              "available_start": None,
              "available_end": None,
              "candles": [],
              "current": None,
          }
          try:
              resolve_acquisition_range(request, "M1", missing)
          except ValueError as exc:
              assert "open-start scope requires existing retained history" in str(exc)
          else:
              raise AssertionError("open-start range without retained history must fail")

          try:
              parse_market_data_request([
                  "--symbol", "EURUSD",
                  "--timeframes", "M1",
                  "current",
              ])
          except ValueError:
              pass
          else:
              raise AssertionError("positional current scope must remain rejected")

          # The production timeframe update path must use the request mode fields
          # last_closed_only and current after the range correction.
          from MARKET_DATA.service import update_timeframe
          class EmptyProvider:
              def fetch_range(self, symbol, timeframe, start_time, end_time):
                  return []
              def fetch_latest_completed(self, symbol, timeframe):
                  return None
              def fetch_current(self, symbol, timeframe):
                  return None

          runtime_request = parse_market_data_request([
              "--symbol", "EURUSD",
              "--timeframes", "M1",
              "-2026.10.20",
          ])
          runtime_market_data = {
              "symbol": "EURUSD",
              "timeframes": {
                  "M1": {
                      "available_start": "2026-10-05T07:15:00Z",
                      "available_end": "2026-10-05T07:15:00Z",
                      "candles": [{
                          "candle_id": "EURUSD:M1:2026-10-05T07:15:00Z",
                          "timestamp": "2026-10-05T07:15:00Z",
                          "completion_time": "2026-10-05T07:16:00Z",
                          "open": "1.000000000000000000",
                          "high": "1.100000000000000000",
                          "low": "0.900000000000000000",
                          "close": "1.050000000000000000",
                          "volume": {},
                      }],
                      "current": None,
                  }
              },
          }
          assert update_timeframe(
              runtime_market_data,
              EmptyProvider(),
              runtime_request,
              "M1",
          ) is False

          # Range inclusion is based on candle interval start, not completion_time.
          from MARKET_DATA.service import fetch_completed_candles
          class RangeProvider:
              def fetch_range(self, symbol, timeframe, start_time, end_time):
                  return [
                      ProviderCandle(
                          dt("2026-01-01T04:59:00Z"), "UTC",
                          dt("2026-01-01T04:59:00Z"), "1", "2", "0", "1.5"
                      ),
                      ProviderCandle(
                          dt("2026-01-01T05:00:00Z"), "UTC",
                          dt("2026-01-01T05:00:00Z"), "1", "2", "0", "1.5"
                      ),
                  ]

          ranged = fetch_completed_candles(
              RangeProvider(),
              "EURUSD",
              "M1",
              dt("2026-01-01T05:00:00Z"),
              dt("2026-01-01T05:01:00Z"),
          )
          assert [c.timestamp for c in ranged] == [dt("2026-01-01T05:00:00Z")]

          # LSE must be queried directly for each requested timeframe; no
          # lower-timeframe aggregation is permitted.
          direct_provider = LSEMarketDataProvider()
          direct_provider._request_candle_page = lambda symbol, timeframe, start_time, end_time: [
              {
                  "timestamp": "2026-10-10T04:00:00Z",
                  "open": "1", "high": "2", "low": "0", "close": "1.5",
                  "volume": 10,
              }
          ]
          direct = direct_provider.fetch_range(
              "EURUSD", "H4",
              dt("2026-10-10T00:00:00Z"),
              dt("2026-10-10T05:00:00Z"),
          )
          assert len(direct) == 1
          assert direct[0].provider_metadata["interval"] == "H4"
          assert direct[0].provider_metadata["provider"] == "lse"

          # Persisted negative volume and duplicate current/completed identity must fail.
          import tempfile
          from pathlib import Path
          from MARKET_DATA.persistence import load_market_data
          with tempfile.TemporaryDirectory() as temp_dir:
              path = Path(temp_dir) / "EURUSD" / "EURUSD_marketdata.json"
              negative = {
                  "symbol": "EURUSD",
                  "timeframes": {
                      "M1": {
                          "available_start": "2026-10-10T05:00:00Z",
                          "available_end": "2026-10-10T05:00:00Z",
                          "candles": [{
                              "candle_id": "EURUSD_M1_2026-10-10T05:00:00Z",
                              "timestamp": "2026-10-10T05:00:00Z",
                              "completion_time": "2026-10-10T05:01:00Z",
                              "open": "1",
                              "high": "2",
                              "low": "0",
                              "close": "1",
                              "volume": {"total": "-1"}
                          }],
                          "current": None
                      }
                  }
              }
              path.parent.mkdir(parents=True)
              import json
              path.write_text(json.dumps(negative), encoding="utf-8")
              try:
                  load_market_data(path, "EURUSD")
              except ValueError:
                  pass
              else:
                  raise AssertionError("negative persisted volume must fail")

              duplicate = json.loads(json.dumps(negative))
              duplicate["timeframes"]["M1"]["candles"][0]["volume"]["total"] = "1"
              duplicate["timeframes"]["M1"]["current"] = duplicate["timeframes"]["M1"]["candles"][0]
              path.write_text(json.dumps(duplicate), encoding="utf-8")
              try:
                  load_market_data(path, "EURUSD")
              except ValueError:
                  pass
              else:
                  raise AssertionError("current/completed identity conflict must fail")

          # Malformed LSE OHLC records must fail instead of being silently repaired.
          malformed_rows = [{
              "timestamp": "2026-10-10T05:00:00Z",
              "open": "1.0",
              "high": "2.0",
              "low": "0.0",
              "close": None,
              "volume": 10,
          }]
          malformed_provider = LSEMarketDataProvider()
          try:
              malformed_provider._parse_lse_candle_rows(malformed_rows, "EURUSD", "M1")
          except ValueError:
              pass
          else:
              raise AssertionError("missing LSE OHLC must fail")

          # Persistence serialization must use the canonical Decimal serializer rather than an obsolete helper name.
          from MARKET_DATA.persistence import _validate_persisted_decimal, serialize_market_data
          serialized = serialize_market_data({"symbol": "EURUSD", "timeframes": {}})
          assert serialized.endswith("\n")
          assert "\"timeframes\": {}" in serialized

          # Persisted Decimal values must use the approved plain base-10 representation.
          from MARKET_DATA.persistence import _validate_persisted_decimal
          _validate_persisted_decimal("1.230000000000000000", "price")
          for invalid_decimal in ("1e-3", "01.2", "1.0000000000000000001"):
              try:
                  _validate_persisted_decimal(invalid_decimal, "price")
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"invalid persisted Decimal accepted: {invalid_decimal}")

          # Current candles are requested directly from LSE at the requested timeframe.
          current_provider = LSEMarketDataProvider()
          current_provider._request_candle_page = lambda symbol, timeframe, start_time, end_time: [
              {
                  "timestamp": "2026-10-10T04:00:00Z",
                  "open": "1", "high": "2", "low": "0", "close": "1.5",
                  "volume": 100,
              }
          ]
          from unittest.mock import patch
          frozen_now = dt("2026-10-10T05:30:00Z")
          with patch("MARKET_DATA.provider.datetime") as provider_datetime:
              provider_datetime.now.return_value = frozen_now
              provider_datetime.fromtimestamp = datetime.fromtimestamp
              provider_datetime.fromisoformat = datetime.fromisoformat
              provider_datetime.side_effect = datetime
              provider_datetime.min = datetime.min
              provider_datetime.max = datetime.max
              assert current_provider.fetch_current("EURUSD", "H4") is not None

          # W1 and MN1 use calendar boundaries, not fixed durations.
          from MARKET_DATA.normalization import (
              canonical_interval_end,
              canonical_interval_start,
              derive_completion_time,
          )
          assert canonical_interval_start(dt("2026-10-07T12:00:00Z"), "W1") == dt("2026-10-05T00:00:00Z")
          assert canonical_interval_end(dt("2026-10-05T00:00:00Z"), "W1") == dt("2026-10-12T00:00:00Z")
          assert canonical_interval_start(dt("2026-02-28T12:00:00Z"), "MN1") == dt("2026-02-01T00:00:00Z")
          assert canonical_interval_end(dt("2026-02-01T00:00:00Z"), "MN1") == dt("2026-03-01T00:00:00Z")
          assert canonical_interval_end(dt("2024-02-01T00:00:00Z"), "MN1") == dt("2024-03-01T00:00:00Z")
          assert derive_completion_time(dt("2026-10-05T00:00:00Z"), "W1") == dt("2026-10-12T00:00:00Z")
          assert derive_completion_time(dt("2026-10-01T00:00:00Z"), "MN1") == dt("2026-11-01T00:00:00Z")

          calendar_state = {
              "available_start": "2026-09-01T00:00:00Z",
              "available_end": "2026-10-05T00:00:00Z",
              "candles": [],
              "current": None,
          }
          w1_incremental = resolve_acquisition_range(incremental_request, "W1", calendar_state)
          assert w1_incremental[0] == dt("2026-10-12T00:00:00Z")

          calendar_state["available_end"] = "2026-09-01T00:00:00Z"
          mn1_incremental = resolve_acquisition_range(incremental_request, "MN1", calendar_state)
          assert mn1_incremental[0] == dt("2026-10-01T00:00:00Z")

          # --lastclosed is exclusive of every positional historical scope form, including open-start.
          try:
              parse_market_data_request([
                  "--symbol", "EURUSD",
                  "--timeframes", "M1",
                  "--lastclosed",
                  "-2026.10.20",
              ])
          except ValueError as exc:
              assert "lastclosed cannot be combined" in str(exc)
          else:
              raise AssertionError("lastclosed + open-start range must be rejected")

          # LSE range acquisition must page forward until the requested interval is exhausted.
          from MARKET_DATA.provider import LSEMarketDataProvider
          paged_provider = LSEMarketDataProvider()
          page_requests = []
          page_rows = [
              [{"timestamp": "2026-10-10T05:00:00Z", "open": "1", "high": "2", "low": "0", "close": "1.5", "volume": 1}],
              [{"timestamp": "2026-10-10T05:01:00Z", "open": "1", "high": "2", "low": "0", "close": "1.5", "volume": 2}],
              [],
          ]
          def paged_request(symbol, timeframe, start_time, end_time):
              page_requests.append((symbol, timeframe, start_time, end_time))
              return page_rows.pop(0)
          paged_provider._request_candle_page = paged_request
          paged_candles = paged_provider.fetch_range(
              "EURUSD",
              "M1",
              dt("2026-10-10T05:00:00Z"),
              dt("2026-10-10T05:02:00Z"),
          )
          assert [c.timestamp for c in paged_candles] == [
              dt("2026-10-10T05:00:00Z"),
              dt("2026-10-10T05:01:00Z"),
          ]
          assert [item[2] for item in page_requests] == [
              dt("2026-10-10T05:00:00Z"),
              dt("2026-10-10T05:01:00Z"),
          ]

          # W1/MN1 persisted states must use calendar completion boundaries and
          # must remain loadable; they are not fixed-duration TIMEFRAME_SECONDS entries.
          from MARKET_DATA.persistence import load_market_data
          with tempfile.TemporaryDirectory() as temp_dir:
              calendar_path = Path(temp_dir) / "EURUSD" / "EURUSD_marketdata.json"
              calendar_path.parent.mkdir(parents=True)
              calendar_document = {
                  "symbol": "EURUSD",
                  "timeframes": {
                      "W1": {
                          "available_start": "2026-10-05T00:00:00Z",
                          "available_end": "2026-10-05T00:00:00Z",
                          "candles": [{
                              "candle_id": "EURUSD_W1_2026-10-05T00:00:00Z",
                              "timestamp": "2026-10-05T00:00:00Z",
                              "completion_time": "2026-10-12T00:00:00Z",
                              "open": "1",
                              "high": "2",
                              "low": "0",
                              "close": "1",
                              "volume": {}
                          }],
                          "current": {
                              "candle_id": "EURUSD_W1_2026-10-12T00:00:00Z",
                              "timestamp": "2026-10-12T00:00:00Z",
                              "completion_time": "2026-10-19T00:00:00Z",
                              "open": "1",
                              "high": "2",
                              "low": "0",
                              "close": "1",
                              "volume": {}
                          }
                      },
                      "MN1": {
                          "available_start": "2026-09-01T00:00:00Z",
                          "available_end": "2026-09-01T00:00:00Z",
                          "candles": [{
                              "candle_id": "EURUSD_MN1_2026-09-01T00:00:00Z",
                              "timestamp": "2026-09-01T00:00:00Z",
                              "completion_time": "2026-10-01T00:00:00Z",
                              "open": "1",
                              "high": "2",
                              "low": "0",
                              "close": "1",
                              "volume": {}
                          }],
                          "current": {
                              "candle_id": "EURUSD_MN1_2026-10-01T00:00:00Z",
                              "timestamp": "2026-10-01T00:00:00Z",
                              "completion_time": "2026-11-01T00:00:00Z",
                              "open": "1",
                              "high": "2",
                              "low": "0",
                              "close": "1",
                              "volume": {}
                          }
                      }
                  }
              }
              calendar_path.write_text(json.dumps(calendar_document), encoding="utf-8")
              loaded_calendar_document = load_market_data(calendar_path, "EURUSD")
              assert set(loaded_calendar_document["timeframes"]) == {"W1", "MN1"}

              invalid_calendar_document = json.loads(json.dumps(calendar_document))
              invalid_calendar_document["timeframes"]["W1"]["candles"][0]["completion_time"] = "2026-10-11T00:00:00Z"
              calendar_path.write_text(json.dumps(invalid_calendar_document), encoding="utf-8")
              try:
                  load_market_data(calendar_path, "EURUSD")
              except ValueError as exc:
                  assert "completion_time does not match timeframe boundary" in str(exc)
              else:
                  raise AssertionError("invalid W1 completed boundary must fail")

              invalid_calendar_document = json.loads(json.dumps(calendar_document))
              invalid_calendar_document["timeframes"]["MN1"]["candles"][0]["completion_time"] = "2026-09-30T00:00:00Z"
              calendar_path.write_text(json.dumps(invalid_calendar_document), encoding="utf-8")
              try:
                  load_market_data(calendar_path, "EURUSD")
              except ValueError as exc:
                  assert "completion_time does not match timeframe boundary" in str(exc)
              else:
                  raise AssertionError("invalid MN1 completed boundary must fail")


          # Provider credentials are file-based, provider-isolated, and never exposed by errors.
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from PROVIDERS.credentials import (
              ProviderCredentialError,
              get_provider_api_key,
          )
          with TemporaryDirectory() as temp_dir:
              key_dir = Path(temp_dir)
              (key_dir / "lse.apikey").write_text(" synthetic-lse-key \n", encoding="utf-8")
              assert get_provider_api_key("lse", api_keys_directory=key_dir) == "synthetic-lse-key"
              (key_dir / "lse.apikey").write_text("line-one\nline-two\n", encoding="utf-8")
              try:
                  get_provider_api_key("lse", api_keys_directory=key_dir)
              except ProviderCredentialError:
                  pass
              else:
                  raise AssertionError("multi-line provider credential must fail closed")
              try:
                  get_provider_api_key("missing_provider", api_keys_directory=key_dir)
              except ProviderCredentialError as exc:
                  assert "synthetic-lse-key" not in str(exc)
              else:
                  raise AssertionError("missing provider key must fail closed")
              for invalid_provider in (".", "..", "../escape", "bad/provider"):
                  try:
                      get_provider_api_key(invalid_provider, api_keys_directory=key_dir)
                  except ProviderCredentialError:
                      pass
                  else:
                      raise AssertionError("unsafe provider credential identifier must fail")
          import os
          os.environ["LSE_API_KEY"] = "synthetic-env-key"
          try:
              with TemporaryDirectory() as temp_dir:
                  assert get_provider_api_key(
                      "lse",
                      api_keys_directory=Path(temp_dir),
                  ) == "synthetic-env-key"
          finally:
              os.environ.pop("LSE_API_KEY", None)

          print("MARKET_DATA_RANGE_TESTS_OK")
          PY
