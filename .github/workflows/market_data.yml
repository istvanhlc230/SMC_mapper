name: Market Data Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  market-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile market_data.py && python -m compileall -q COMMON MARKET_DATA
      - name: Market Data range contract tests
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          import urllib.error
          import urllib.parse
          import socket
          import subprocess
          import sys

          no_args_help = subprocess.run(
              [sys.executable, "market_data.py"],
              capture_output=True,
              text=True,
          )
          assert no_args_help.returncode == 0, no_args_help.stderr
          assert "SYMBOL" in no_args_help.stdout
          assert "--timeframes" in no_args_help.stdout

          assert "--symbol" not in no_args_help.stdout

          from MARKET_DATA.provider import LSEMarketDataProvider, create_provider
          from MARKET_DATA.cli import parse_market_data_request
          from MARKET_DATA.models import MarketDataRequest, ProviderCandle
          from MARKET_DATA.service import resolve_acquisition_range
          def dt(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          # The LSE Vault's documented raw timestamp format is UTC but omits
          # the timezone suffix; normalize that exact shape at the provider edge.
          from MARKET_DATA.provider import _parse_lse_timestamp
          assert _parse_lse_timestamp("2026-10-08 05:00:00") == dt("2026-10-08T05:00:00Z")
          assert _parse_lse_timestamp("2026-10-08 05:00:00.123456") == dt(
              "2026-10-08T05:00:00.123456Z"
          )
          assert _parse_lse_timestamp("2026-10-08T05:00:00+02:00") == dt(
              "2026-10-08T03:00:00Z"
          )
          try:
              _parse_lse_timestamp("2026-10-08T05:00:00")
          except ValueError as error:
              assert "timezone-naive" in str(error)
          else:
              raise AssertionError("undocumented timezone-naive ISO timestamps must be rejected")

          lse_row_parser = LSEMarketDataProvider()
          assert lse_row_parser.fetch_market_depth("EURUSD") is None
          parsed_lse_rows = lse_row_parser._parse_lse_candle_rows(
              [{
                  "timestamp": "2026-10-08 05:00:00",
                  "open": "1.1",
                  "high": "1.2",
                  "low": "1.0",
                  "close": "1.15",
                  "volume": 10,
                  "tick_volume": 25,
                  "spread": "0.0002",
                  "real_volume": 18,
              }],
              "EURUSD",
              "M1",
          )
          assert parsed_lse_rows[0].timestamp == dt("2026-10-08T05:00:00Z")
          assert parsed_lse_rows[0].source_timezone == "UTC"
          assert parsed_lse_rows[0].tick_volume == 25
          assert parsed_lse_rows[0].spread == "0.0002"
          assert parsed_lse_rows[0].real_volume == 18

          # LSE candle query filters must be UTC dates, while the caller's exact
          # timestamps are applied locally after the provider response is parsed.
          date_filter_provider = LSEMarketDataProvider()
          with patch("MARKET_DATA.provider.get_provider_api_key", return_value="test-key"), patch(
              "MARKET_DATA.provider.HttpClient.get", return_value=[]
          ) as mocked_lse_http:
              date_filter_provider._request_candle_page(
                  "EURUSD",
                  "M1",
                  dt("2026-10-08T12:30:00Z"),
                  dt("2026-10-10T18:45:00Z"),
              )
          lse_query = urllib.parse.parse_qs(
              urllib.parse.urlsplit(mocked_lse_http.call_args.args[0]).query
          )
          assert lse_query["symbol"] == ["EUR/USD"]
          assert lse_query["timeframe"] == ["1m"]
          assert lse_query["start"] == ["2026-10-08"]
          assert lse_query["end"] == ["2026-10-10"]
          assert lse_query["limit"] == ["5000"]

          # --table is the only human-readable output option; --cleartext is not an alias.
          from decimal import Decimal
          from MARKET_DATA.cli import run as run_market_data_request
          from MARKET_DATA.models import (
              MarketDepthLevel,
              MarketDepthSnapshot,
              NormalizedCandle,
              VolumeState,
          )
          from MARKET_DATA.protocol import format_table

          table_request = parse_market_data_request([
              "EURUSD", "--timeframes", "M1", "--table"
          ])

          assert table_request.symbol == "EURUSD"
          try:
              parse_market_data_request([
                  "--symbol", "EURUSD", "--timeframes", "M1"
              ])
          except ValueError as error:
              assert "SYMBOL is positional" in str(error)
          else:
              raise AssertionError("--symbol must be rejected; SYMBOL is positional")
          assert table_request.table is True
          try:
              parse_market_data_request([
                  "EURUSD", "--timeframes", "M1", "--cleartext"
              ])
          except ValueError as error:
              assert "--cleartext is no longer supported" in str(error)
              assert "--table" in str(error)
          else:
              raise AssertionError("--cleartext must be rejected rather than accepted as an alias")

          sample_candle = NormalizedCandle(
              candle_id="EURUSD_M1_2026-10-10T00:00:00Z",
              timestamp=dt("2026-10-10T00:00:00Z"),
              completion_time=dt("2026-10-10T00:01:00Z"),
              open_price=Decimal("1.1"),
              high_price=Decimal("1.2"),
              low_price=Decimal("1.0"),
              close_price=Decimal("1.15"),
              volume=VolumeState(True, Decimal("12345"), False, None, None, False, None, None),
          )
          sample_entries = {"M1": [(sample_candle, True)]}
          rendered_table = format_table("EURUSD", sample_entries)
          assert "MARKET DATA | EURUSD" in rendered_table
          assert "TIMEFRAME | M1 | CANDLES 1" in rendered_table
          assert "2026-10-10 00:00:00" in rendered_table
          assert "1.15" in rendered_table
          assert "Volume" in rendered_table
          assert "12345" in rendered_table
          assert "Completed" not in rendered_table

          current_table = format_table("EURUSD", {"M1": [(sample_candle, False)]})
          assert "CURRENT SNAPSHOT" in current_table
          assert "Completed" not in current_table

          # Missing total volume is shown as unavailable, never as a fabricated zero.
          from dataclasses import replace
          candle_without_volume = replace(
              sample_candle,
              volume=VolumeState(False, None, False, None, None, False, None, None),
          )
          no_volume_table = format_table(
              "EURUSD", {"M1": [(candle_without_volume, True)]}
          )
          assert "N/A" in no_volume_table
          assert "L2 MARKET DEPTH" not in rendered_table
          assert "L2 MARKET DEPTH" not in no_volume_table

          # A real provider-returned L2 snapshot gets a separate section. It is
          # not merged into a candle's aggregate volume or duplicated per candle.
          sample_depth = MarketDepthSnapshot(
              symbol="EURUSD",
              provider="synthetic",
              timestamp=dt("2026-10-10T00:00:30Z"),
              bids=[
                  MarketDepthLevel(Decimal("1.1499"), Decimal("250")),
                  MarketDepthLevel(Decimal("1.1498"), Decimal("400")),
              ],
              asks=[
                  MarketDepthLevel(Decimal("1.1501"), Decimal("300")),
              ],
          )
          l2_table = format_table(
              "EURUSD", sample_entries, market_depth=sample_depth
          )
          assert "L2 MARKET DEPTH | PROVIDER synthetic" in l2_table
          assert "2026-10-10 00:00:30" in l2_table
          assert "Bid Volume" in l2_table and "Ask Volume" in l2_table
          assert "250" in l2_table and "300" in l2_table and "400" in l2_table
          assert "L2 MARKET DEPTH" not in format_table("EURUSD", sample_entries)

          # Machine CSV must remain aligned to the 13-column Mapper/Monitor contract,
          # and it must carry volume_total and a complete observed orderflow pair.
          import csv
          import io
          from MARKET_DATA.protocol import MACHINE_PROTOCOL_HEADER, serialize_machine_csv
          assert MACHINE_PROTOCOL_HEADER == (
              "timeframe", "time", "open", "high", "low", "close",
              "tick_volume", "spread", "real_volume", "volume_total",
              "orderflow_buy", "orderflow_sell", "completed",
          )
          machine_rows = list(csv.reader(io.StringIO(serialize_machine_csv(sample_entries))))
          assert machine_rows[0] == list(MACHINE_PROTOCOL_HEADER)
          assert len(machine_rows[1]) == 13
          assert machine_rows[1][6:9] == ["", "", ""]
          assert machine_rows[1][9:] == ["12345", "", "", "1"]

          # Explicit provider fields retain their own protocol slots; no field is
          # inferred from total volume or substituted for another field.
          provider_fields_candle = replace(
              sample_candle,
              tick_volume=Decimal("88"),
              spread=Decimal("0.0002"),
              real_volume=Decimal("777"),
          )
          provider_fields_rows = list(csv.reader(io.StringIO(
              serialize_machine_csv({"M1": [(provider_fields_candle, True)]})
          )))
          assert provider_fields_rows[1][6:10] == [
              "88", "0.0002", "777", "12345"
          ]

          observed_orderflow_candle = replace(
              sample_candle,
              volume=VolumeState(
                  True, Decimal("12345"),
                  False, None, None,
                  True, Decimal("5000"), Decimal("7345"),
              ),
          )
          observed_orderflow_rows = list(csv.reader(io.StringIO(
              serialize_machine_csv({"M1": [(observed_orderflow_candle, True)]})
          )))
          assert observed_orderflow_rows[1][9:13] == [
              "12345", "5000", "7345", "1"
          ]

          malformed_orderflow_candle = replace(
              observed_orderflow_candle,
              volume=VolumeState(
                  True, Decimal("12345"),
                  False, None, None,
                  True, Decimal("5000"), None,
              ),
          )
          try:
              serialize_machine_csv({"M1": [(malformed_orderflow_candle, True)]})
          except ValueError as error:
              assert "complete finite buy/sell pair" in str(error)
          else:
              raise AssertionError("partial observed orderflow must be rejected")

          class SyntheticDepthProvider:
              def fetch_market_depth(self, symbol, as_of=None):
                  assert symbol == "EURUSD"
                  assert as_of is None
                  return sample_depth

          with patch(
              "MARKET_DATA.cli.create_provider",
              return_value=SyntheticDepthProvider(),
          ), patch(
              "MARKET_DATA.cli.get_candles", return_value={"M1": [sample_candle]}
          ), patch("builtins.print") as captured_l2_stdout:
              assert run_market_data_request(table_request) == 0
          assert "L2 MARKET DEPTH" in captured_l2_stdout.call_args.args[0]

          class UnavailableDepthProvider:
              def fetch_market_depth(self, symbol, as_of=None):
                  return None

          with patch(
              "MARKET_DATA.cli.create_provider",
              return_value=UnavailableDepthProvider(),
          ), patch(
              "MARKET_DATA.cli.get_candles", return_value={"M1": [sample_candle]}
          ), patch("builtins.print") as captured_no_l2_stdout:
              assert run_market_data_request(table_request) == 0
          assert "L2 MARKET DEPTH" not in captured_no_l2_stdout.call_args.args[0]

          historical_request = parse_market_data_request([
              "EURUSD", "--timeframes", "M1", "2026.10.09", "--table"
          ])
          with patch(
              "MARKET_DATA.cli.create_provider",
              return_value=SyntheticDepthProvider(),
          ), patch(
              "MARKET_DATA.cli.get_candles", return_value={"M1": [sample_candle]}
          ), patch("builtins.print") as captured_historical_stdout:
              assert run_market_data_request(historical_request) == 0
          assert "L2 MARKET DEPTH" not in captured_historical_stdout.call_args.args[0]

          # A snapshot exactly at an exclusive historical end is outside the scope.
          boundary_depth = replace(
              sample_depth,
              timestamp=dt("2026-10-10T00:00:00Z"),
          )
          class BoundaryDepthProvider:
              def fetch_market_depth(self, symbol, as_of=None):
                  assert as_of == dt("2026-10-10T00:00:00Z")
                  return boundary_depth

          with patch(
              "MARKET_DATA.cli.create_provider",
              return_value=BoundaryDepthProvider(),
          ), patch(
              "MARKET_DATA.cli.get_candles", return_value={"M1": [sample_candle]}
          ), patch("builtins.print") as captured_boundary_stdout:
              assert run_market_data_request(historical_request) == 0
          assert "L2 MARKET DEPTH" not in captured_boundary_stdout.call_args.args[0]

          # A last-closed request may show only depth valid at its candle-close time.
          lastclosed_table_request = parse_market_data_request([
              "EURUSD", "--timeframes", "M1", "--lastclosed", "--table"
          ])
          class LastClosedDepthProvider:
              def fetch_market_depth(self, symbol, as_of=None):
                  assert as_of == sample_candle.completion_time
                  return sample_depth

          with patch(
              "MARKET_DATA.cli.create_provider",
              return_value=LastClosedDepthProvider(),
          ), patch(
              "MARKET_DATA.cli.get_candles", return_value={"M1": [sample_candle]}
          ), patch("builtins.print") as captured_lastclosed_stdout:
              assert run_market_data_request(lastclosed_table_request) == 0
          assert "L2 MARKET DEPTH" in captured_lastclosed_stdout.call_args.args[0]

          # Future-dated snapshots are never presented as current depth.
          future_depth = replace(
              sample_depth,
              timestamp=dt("2099-01-01T00:00:00Z"),
          )
          class FutureDepthProvider:
              def fetch_market_depth(self, symbol, as_of=None):
                  return future_depth

          with patch(
              "MARKET_DATA.cli.create_provider",
              return_value=FutureDepthProvider(),
          ), patch(
              "MARKET_DATA.cli.get_candles", return_value={"M1": [sample_candle]}
          ), patch("builtins.print") as captured_future_stdout:
              assert run_market_data_request(table_request) == 0
          assert "L2 MARKET DEPTH" not in captured_future_stdout.call_args.args[0]

          class FailingDepthProvider:
              def fetch_market_depth(self, symbol, as_of=None):
                  raise RuntimeError("synthetic depth endpoint failure")

          with patch(
              "MARKET_DATA.cli.create_provider",
              return_value=FailingDepthProvider(),
          ), patch(
              "MARKET_DATA.cli.get_candles", return_value={"M1": [sample_candle]}
          ), patch("builtins.print") as captured_failed_l2_stdout:
              assert run_market_data_request(table_request) == 0
          assert "L2 MARKET DEPTH" not in captured_failed_l2_stdout.call_args.args[0]
          assert "TIMEFRAME | M1 | CANDLES 1" in captured_failed_l2_stdout.call_args.args[0]

          with patch("MARKET_DATA.cli.create_provider"), patch(
              "MARKET_DATA.cli.get_candles", return_value={"M1": [sample_candle]}
          ), patch("builtins.print") as captured_stdout:
              assert run_market_data_request(table_request) == 0
          assert "TIMEFRAME | M1 | CANDLES 1" in captured_stdout.call_args.args[0]

          default_request = parse_market_data_request([
              "EURUSD", "--timeframes", "M1"
          ])
          assert default_request.table is False
          with patch("MARKET_DATA.cli.create_provider"), patch(
              "MARKET_DATA.cli.get_candles", return_value={"M1": [sample_candle]}
          ), patch("builtins.print") as captured_stdout:
              assert run_market_data_request(default_request) == 0
          assert captured_stdout.call_args.args[0].startswith("timeframe,time,")
          assert "MARKET DATA | EURUSD" not in captured_stdout.call_args.args[0]

          from COMMON.date_time import DateTimeScopeParser, DateTimeScopeError
          from COMMON.atomic_file import atomic_write_text
          from COMMON.http_client import HttpClient, HttpRequestError
          import COMMON.http_client as shared_http_client

          # The shared parser is deterministic, strict, and independent of consumer modules.
          shared_parser = DateTimeScopeParser(reference_time=dt("2026-10-06T12:00:00Z"))

          # Resolving an open-end scope must use the parser's captured UTC time.
          captured_open_end = shared_parser.parse("2026.10.06 10:30-")
          captured_start, captured_end = captured_open_end.resolve_interval()
          assert captured_start == dt("2026-10-06T10:30:00Z")
          assert captured_end == dt("2026-10-06T12:00:00Z")

          # Shared atomic replacement commits complete content and preserves the old
          # destination if the final atomic replacement fails.
          with TemporaryDirectory() as temporary_directory:
              destination = Path(temporary_directory) / "shared-state.txt"
              destination.write_text("old", encoding="utf-8")
              atomic_write_text(destination, "new", retry_limit=1)
              assert destination.read_text(encoding="utf-8") == "new"
              with patch("COMMON.atomic_file.os.replace", side_effect=OSError("synthetic replace failure")):
                  try:
                      atomic_write_text(destination, "uncommitted", retry_limit=1)
                  except OSError:
                      pass
                  else:
                      raise AssertionError("atomic replacement failure must be propagated")
              assert destination.read_text(encoding="utf-8") == "new"
              assert not list(Path(temporary_directory).glob(".atomic.*.tmp"))

          # HTTP error text and traceback context must not leak URLs or credentials.
          with patch(
              "COMMON.http_client.urllib.request.urlopen",
              side_effect=urllib.error.URLError("https://internal.invalid/?token=synthetic-secret"),
          ):
              try:
                  HttpClient.get(
                      "https://internal.invalid/?token=synthetic-secret",
                      response_format="text",
                  )
              except HttpRequestError as error:
                  assert "synthetic-secret" not in str(error)
                  assert "internal.invalid" not in str(error)
                  assert error.__cause__ is None
              else:
                  raise AssertionError("HTTP transport error must be reported")

          # IPv4 is attempted before IPv6 even when DNS lists IPv6 first. This
          # prevents broken local IPv6 routes from delaying reachable IPv4 APIs.
          connection_attempts = []
          class SyntheticSocket:
              def __init__(self, address_family, socket_type, protocol):
                  self.address_family = address_family
              def settimeout(self, timeout):
                  self.timeout = timeout
              def bind(self, source_address):
                  self.source_address = source_address
              def connect(self, address):
                  connection_attempts.append(self.address_family)
                  if self.address_family == socket.AF_INET6:
                      raise OSError("synthetic IPv6 route failure")
              def close(self):
                  pass

          synthetic_address_info = [
              (socket.AF_INET6, socket.SOCK_STREAM, socket.IPPROTO_TCP, "", ("2001:db8::1", 443, 0, 0)),
              (socket.AF_INET, socket.SOCK_STREAM, socket.IPPROTO_TCP, "", ("192.0.2.1", 443)),
          ]
          with patch("COMMON.http_client.socket.getaddrinfo", return_value=synthetic_address_info), patch(
              "COMMON.http_client.socket.socket", SyntheticSocket
          ):
              connected_socket = shared_http_client._ipv4_first_create_connection(
                  ("example.invalid", 443), timeout=5
              )
          assert connected_socket.address_family == socket.AF_INET
          assert connection_attempts == [socket.AF_INET]

          # IPv6 remains a fallback when no IPv4 address can connect.
          connection_attempts.clear()
          class SyntheticFallbackSocket(SyntheticSocket):
              def connect(self, address):
                  connection_attempts.append(self.address_family)
                  if self.address_family == socket.AF_INET:
                      raise OSError("synthetic IPv4 route failure")
          with patch("COMMON.http_client.socket.getaddrinfo", return_value=synthetic_address_info), patch(
              "COMMON.http_client.socket.socket", SyntheticFallbackSocket
          ):
              fallback_socket = shared_http_client._ipv4_first_create_connection(
                  ("example.invalid", 443), timeout=5
              )
          assert fallback_socket.address_family == socket.AF_INET6
          assert connection_attempts == [socket.AF_INET, socket.AF_INET6]

          # Closed scopes use the same captured reference clock.
          assert shared_parser.parse("2026.10.06").end == dt("2026-10-07T00:00:00Z")
          assert shared_parser.parse("2026.10.06 15:30").end == dt("2026-10-06T15:31:00Z")
          assert shared_parser.parse("09:30-11:00").end == dt("2026-10-06T11:00:00Z")
          assert shared_parser.parse("2026.10.06 15:30-").open_end
          assert shared_parser.parse("-2026.10.06 15:30").open_start
          try:
              shared_parser.parse("2026.02.30")
          except DateTimeScopeError:
              pass
          else:
              raise AssertionError("invalid date must be rejected by shared parser")


          # The production CLI/provider boundary must select the canonical LSE adapter.
          assert isinstance(create_provider("lse"), LSEMarketDataProvider)
          try:
              create_provider("yahoo_charts")
          except ValueError:
              pass
          else:
              raise AssertionError("obsolete Yahoo Charts provider must be rejected")

          request = parse_market_data_request([
              "EURUSD",
              "--timeframes", "M1", "M5",
              "2026.10.06-",
          ])
          assert request.start_time == dt("2026-10-06T00:00:00Z")
          assert request.end_time is None
          assert request.current is False
          assert request.last_closed_only is False

          open_end_request = parse_market_data_request([
              "EURUSD",
              "--timeframes", "M1",
              "2026.10.06 15:30-",
          ])
          assert open_end_request.start_time == dt("2026-10-06T15:30:00Z")
          assert open_end_request.end_time is None

          # A date-time range may be split by the shell into tokens around its space.
          explicit_datetime_range = parse_market_data_request([
              "EURUSD",
              "--timeframes", "H1", "M15",
              "2026.10.06", "08:00-2026.10.10", "15:30",
          ])
          assert explicit_datetime_range.start_time == dt("2026-10-06T08:00:00Z")
          assert explicit_datetime_range.end_time == dt("2026-10-10T15:30:00Z")
          assert explicit_datetime_range.timeframes == ["H1", "M15"]

          # Retired flag-based date syntax must fail rather than be silently accepted.
          for legacy_flag in ("--range", "--date", "--time"):
              try:
                  parse_market_data_request([
                      "EURUSD",
                      "--timeframes", "H1",
                      legacy_flag, "2026.10.06",
                  ])
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"retired {legacy_flag} flag must be rejected")

          request = parse_market_data_request([
              "EURUSD",
              "--timeframes", "M1", "M5",
              "-2026.10.20",
          ])
          assert request.start_time is None
          assert request.end_time == dt("2026-10-21T00:00:00Z")
          assert request.current is False
          assert request.last_closed_only is False

          request = parse_market_data_request([
              "EURUSD",
              "--timeframes", "M1",
              "-2026.10.06 05:00",
          ])
          assert request.start_time is None
          assert request.end_time == dt("2026-10-06T05:01:00Z")

          # The old HH.MM compatibility spelling is rejected for open-start scopes too.
          try:
              parse_market_data_request([
                  "EURUSD",
                  "--timeframes", "M1",
                  "-2026.10.06 05.00",
              ])
          except ValueError:
              pass
          else:
              raise AssertionError("open-start HH.MM scope must be rejected")

          # HH.MM is not part of the public scope grammar.
          try:
              parse_market_data_request([
                  "EURUSD",
                  "--timeframes", "M1",
                  "2026.10.05 05.00",
              ])
          except ValueError:
              pass
          else:
              raise AssertionError("explicit HH.MM datetime must be rejected")

          # Future starts are invalid for every positional historical scope form.
          try:
              parse_market_data_request([
                  "EURUSD",
                  "--timeframes", "M1",
                  "2099.01.01-",
              ])
          except ValueError as exc:
              assert "future scope start" in str(exc)
          else:
              raise AssertionError("future open-end start must be rejected")

          try:
              parse_market_data_request([
                  "EURUSD",
                  "--timeframes", "M1",
                  "2099.01.01-2099.01.02",
              ])
          except ValueError as exc:
              assert "future scope start" in str(exc)
          else:
              raise AssertionError("future explicit start must be rejected")

          # --lastclosed cannot be combined with any positional historical scope.
          try:
              parse_market_data_request([
                  "EURUSD",
                  "--timeframes", "M1",
                  "--lastclosed",
                  "2026.10.05",
              ])
          except ValueError as exc:
              assert "lastclosed cannot be combined" in str(exc)
          else:
              raise AssertionError("lastclosed + range must be rejected")

          # main() converts CLI ValueError into a concise non-zero exit result.
          from MARKET_DATA.cli import main
          assert main([
              "EURUSD",
              "--timeframes", "M1",
              "2099.01.01-",
          ]) == 2

